  border:1px solid #d1d5db;

}

.zx_hist_tipo{
  font-size:18px;

<body>

<div id="zx_top">
  <h1>Zentryx V2646</h1>
  <div id="zx_fecha"></div>
  <div id="zx_hora"></div>
  <button id="zx_logout" onclick="logout()">Salir</button>
</div>

<div id="app"></div>

<div id="zx_footer">
  <div id="zx_footer_top">
    <div id="zx_footer_logo">Z</div>
    <div id="zx_footer_info">
      <h3>Zentryx PRO</h3>
      <p id="zx_footer_usuario">Cargando usuario...</p>
    </div>
  </div>

  <div id="zx_footer_menu">
    <button class="zx_footer_btn" onclick="ZX_inicio()">Inicio</button>
    <button class="zx_footer_btn" onclick="ZX_fichaje()">Fichaje</button>
    <button class="zx_footer_btn" onclick="ZX_usuarios()">Usuarios</button>
    <button class="zx_footer_btn" onclick="ZX_vehiculos()">Vehículos</button>
    <button class="zx_footer_btn" onclick="ZX_incidencias()">Incidencias</button>
    <button class="zx_footer_btn" onclick="ZX_informes()">Informes</button>
  </div>
</div>

<script>
const ZX_VERSION="2646";

const SUPABASE_URL="https://idtaamivqbiuxtjywuux.supabase.co";
const SUPABASE_KEY="sb_publishable_ToDLKonbF2QnTXi56o1nfQ_10IdaPJx";

window.sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function $(id){
  return document.getElementById(id);
}

function limpiarTexto(valor){
  return String(valor ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function usuarioActual(){
  const guardado=localStorage.getItem("usuario");

  if(!guardado){
    return "admin";
  }

  try{
    const datos=JSON.parse(guardado);
    return datos.usuario || datos.nombre || datos.email || "admin";
  }catch(e){
    return guardado || "admin";
  }
}

function pintarUsuarioFooter(){
  $("zx_footer_usuario").textContent=usuarioActual();
}

function estadoActual(){
  return localStorage.getItem("zx_estado") || "fuera";
}

function pausaActual(){
  return localStorage.getItem("zx_pausa") || "no";
}

function comidaActual(){
  return localStorage.getItem("zx_comida") || "no";
}

function actualizarReloj(){
  const ahora=new Date();

  $("zx_fecha").textContent=ahora.toLocaleDateString("es-ES",{
    weekday:"long",
    year:"numeric",
    month:"long",
    day:"numeric"
  });

  $("zx_hora").textContent=ahora.toLocaleTimeString("es-ES",{
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit"
  });
}

setInterval(actualizarReloj,1000);
actualizarReloj();

function logout(){
  localStorage.removeItem("usuario");
  localStorage.removeItem("zx_estado");
  localStorage.removeItem("zx_pausa");
  localStorage.removeItem("zx_comida");
  localStorage.removeItem("zx_vehiculo_activo");
  location.href="index.html?v="+ZX_VERSION;
}

function estadoVisual(){
  const estado=estadoActual();
  const pausa=pausaActual();
  const comida=comidaActual();

  if(estado==="fuera"){
    return `<div class="zx_estado zx_fuera">Fuera</div>`;
  }

  if(pausa==="si"){
    return `<div class="zx_estado zx_pausa">En pausa</div>`;
  }

  if(comida==="si"){
    return `<div class="zx_estado zx_comida">En comida</div>`;
  }

  return `<div class="zx_estado zx_dentro">Dentro</div>`;
}

function pedirGPS(){
  return new Promise(function(resolve){
    if(!navigator.geolocation){
      resolve({latitud:null,longitud:null});
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function(pos){
        resolve({
          latitud:pos.coords.latitude,
          longitud:pos.coords.longitude
        });
      },
      function(){
        resolve({latitud:null,longitud:null});
      },
      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:0
      }
    );
  });
}

function leerVehiculoActivo(){
  const valor=localStorage.getItem("zx_vehiculo_activo");

  if(!valor){
    return null;
  }

  try{
    return JSON.parse(valor);
  }catch(e){
    localStorage.removeItem("zx_vehiculo_activo");
    return null;
  }
}

async function obtenerVehiculoUsuario(){
  const usuario=usuarioActual();

  const resUsuario=await window.sb
    .from("usuarios")
    .select("vehiculo_id")
    .eq("usuario",usuario)
    .maybeSingle();

  if(resUsuario.error || !resUsuario.data || !resUsuario.data.vehiculo_id){
    return null;
  }

  const resVehiculo=await window.sb
    .from("vehiculos")
    .select("*")
    .eq("id",resUsuario.data.vehiculo_id)
    .maybeSingle();

  if(resVehiculo.error || !resVehiculo.data){
    return null;
  }

  return resVehiculo.data;
}

function ZX_inicio(){
  $("app").innerHTML=`
    <div class="zx_card">
      <h2>Inicio</h2>
      <div class="zx_text">Sistema principal Zentryx PRO modular activo.</div>
    </div>

    <div class="zx_card">
      <h2>Módulos rápidos</h2>
      <button class="zx_btn zx_rojo" onclick="ZX_fichaje()">Fichaje</button>
      <button class="zx_btn zx_azul" onclick="ZX_usuarios()">Usuarios</button>
      <button class="zx_btn zx_verde" onclick="ZX_vehiculos()">Vehículos</button>
      <button class="zx_btn zx_naranja" onclick="ZX_incidencias()">Incidencias</button>
      <button class="zx_btn zx_morado" onclick="ZX_informes()">Informes</button>
    </div>

    <div class="zx_card">
      <h2>Estado sistema</h2>
      <div class="zx_text">
        <b>Versión:</b> V${ZX_VERSION}<br><br>
        Fichaje operativo<br><br>
        Selector de vehículo en entrada<br><br>
        Control de km en salida<br><br>
        Historial activo<br><br>
        GPS preparado
      </div>
    </div>
  `;
}

async function guardarFichaje(tipo){
  try{
    const estado=estadoActual();
    const pausa=pausaActual();
    const comida=comidaActual();

    let vehiculo=null;
    let km_salida=null;

    const gps=await pedirGPS();

    if(tipo==="entrada"){
      if(estado==="dentro"){
        alert("Ya estás dentro.");
        return;
      }

      const resVehiculos=await window.sb
        .from("vehiculos")
        .select("*")
        .eq("en_uso",false)
        .order("matricula",{ascending:true});

      if(resVehiculos.error){
        alert("Error cargando vehículos.");
        return;
      }

      const vehiculos=resVehiculos.data || [];

      let mensaje="Selecciona vehículo:\n\n";
      mensaje+="0 - Sin vehículo\n\n";

      vehiculos.forEach(function(v,index){
        mensaje+=(index+1)+" - "+(v.matricula || "-")+"\n";
      });

      const seleccion=prompt(mensaje,"0");

      if(seleccion===null){
        return;
      }

      const numero=Number(seleccion);

      if(!Number.isInteger(numero) || numero<0){
        alert("Selección inválida.");
        return;
      }

      if(numero>0){
        const elegido=vehiculos[numero-1];

        if(!elegido){
          alert("Vehículo inválido.");
          return;
        }

        vehiculo=elegido;

        const updVehiculo=await window.sb
          .from("vehiculos")
          .update({
            en_uso:true,
            usuario_asignado:usuarioActual()
          })
          .eq("id",vehiculo.id);

        if(updVehiculo.error){
          alert("No se pudo asignar el vehículo.");
          return;
        }

        localStorage.setItem("zx_vehiculo_activo",JSON.stringify({
          id:vehiculo.id,
          matricula:vehiculo.matricula
        }));
      }else{
        localStorage.removeItem("zx_vehiculo_activo");
      }

      localStorage.setItem("zx_estado","dentro");
      localStorage.setItem("zx_pausa","no");
      localStorage.setItem("zx_comida","no");
    }

    if(tipo==="salida"){
      if(estado==="fuera"){
        alert("No puedes hacer salida sin entrada.");
        return;
      }

      if(pausa==="si"){
        alert("Finaliza la pausa primero.");
        return;
      }

      if(comida==="si"){
        alert("Finaliza la comida primero.");
        return;
      }

      const vehiculoActivo=leerVehiculoActivo();

      if(vehiculoActivo){
        vehiculo=vehiculoActivo;

        const resVehiculo=await window.sb
          .from("vehiculos")
          .select("*")
          .eq("id",vehiculo.id)
          .maybeSingle();

        if(resVehiculo.error){
          alert("Error cargando el vehículo activo.");
          return;
        }

        if(resVehiculo.data){
          vehiculo=resVehiculo.data;

          const km=prompt(
            "Introduce kilómetros actuales del vehículo "+(vehiculo.matricula || ""),
            vehiculo.km_actual ?? 0
          );

          if(km===null || String(km).trim()===""){
            alert("Debes introducir kilómetros.");
            return;
          }

          const kmNumero=Number(String(km).replace(",","."));

          if(Number.isNaN(kmNumero) || kmNumero<0){
            alert("Kilómetros inválidos.");
            return;
          }

          if(vehiculo.km_actual!==null && vehiculo.km_actual!==undefined && kmNumero<Number(vehiculo.km_actual)){
            alert("Los kilómetros no pueden ser menores que los actuales.");
            return;
          }

          km_salida=kmNumero;

          const updVehiculo=await window.sb
            .from("vehiculos")
            .update({
              km_actual:kmNumero,
              en_uso:false,
              usuario_asignado:null
            })
            .eq("id",vehiculo.id);

          if(updVehiculo.error){
            alert("No se pudo actualizar el vehículo.");
            return;
          }
        }

        localStorage.removeItem("zx_vehiculo_activo");
      }

      localStorage.setItem("zx_estado","fuera");
      localStorage.setItem("zx_pausa","no");
      localStorage.setItem("zx_comida","no");
    }

    if(tipo==="inicio_pausa"){
      if(estado==="fuera"){
        alert("No puedes iniciar pausa sin entrada.");
        return;
      }

      if(pausa==="si"){
        alert("Ya estás en pausa.");
        return;
      }

      if(comida==="si"){
        alert("No puedes iniciar pausa estando en comida.");
        return;
      }

      localStorage.setItem("zx_pausa","si");
    }

    if(tipo==="fin_pausa"){
      if(estado==="fuera"){
        alert("No puedes finalizar pausa sin entrada.");
        return;
      }

      if(pausa==="no"){
        alert("No hay pausa iniciada.");
        return;
      }

      localStorage.setItem("zx_pausa","no");
    }

    if(tipo==="inicio_comida"){
      if(estado==="fuera"){
        alert("No puedes iniciar comida sin entrada.");
        return;
      }

      if(comida==="si"){
        alert("Ya estás en comida.");
        return;
      }

      if(pausa==="si"){
        alert("No puedes iniciar comida estando en pausa.");
        return;
      }

      localStorage.setItem("zx_comida","si");
    }

    if(tipo==="fin_comida"){
      if(estado==="fuera"){
        alert("No puedes finalizar comida sin entrada.");
        return;
      }

      if(comida==="no"){
        alert("No hay comida iniciada.");
        return;
      }

      localStorage.setItem("zx_comida","no");
    }

    const registro={
      empresa_id:"demo",
      usuario:usuarioActual(),
      tipo:tipo,
      fecha:new Date().toISOString(),
      estado_jornada:localStorage.getItem("zx_estado") || "fuera",
      latitud:gps.latitud,
      longitud:gps.longitud,
      vehiculo_id:vehiculo ? vehiculo.id : null,
      vehiculo_matricula:vehiculo ? vehiculo.matricula : null,
      km_salida:km_salida
    };

    const res=await window.sb
      .from("fichajes")
      .insert([registro]);

    if(res.error){
      throw res.error;
    }

    ZX_fichaje();

  }catch(e){
    console.error(e);
    alert("Error guardando fichaje: "+(e.message || "error desconocido"));
  }
}

function nombreTipo(tipo){
  const mapa={
    entrada:"Entrada",
    salida:"Salida",
    inicio_pausa:"Inicio pausa",
    fin_pausa:"Fin pausa",
    inicio_comida:"Inicio comida",
    fin_comida:"Fin comida"
  };

  return mapa[tipo] || tipo || "-";
}

async function cargarHistorial(){
  try{
    const res=await window.sb
      .from("fichajes")
      .select("*")
      .eq("usuario",usuarioActual())
      .order("fecha",{ascending:false})
      .limit(20);

    if(res.error){
      throw res.error;
    }

    const datos=res.data || [];

    if(datos.length===0){
      return `<div class="zx_text">Sin fichajes.</div>`;
    }

    return datos.map(function(i){
      const f=new Date(i.fecha);
      const tieneGPS=i.latitud!==null && i.latitud!==undefined && i.longitud!==null && i.longitud!==undefined;
      const tieneKm=i.km_salida!==null && i.km_salida!==undefined;

      return `
        <div class="zx_hist_item">
          <div class="zx_hist_tipo">${limpiarTexto(nombreTipo(i.tipo))}</div>
          <div class="zx_hist_fecha">${f.toLocaleDateString("es-ES")} — ${f.toLocaleTimeString("es-ES")}</div>
          ${i.vehiculo_matricula ? `<div class="zx_hist_fecha">Vehículo: ${limpiarTexto(i.vehiculo_matricula)}</div>` : ""}
          ${tieneKm ? `<div class="zx_hist_fecha">Km salida: ${limpiarTexto(i.km_salida)}</div>` : ""}
          ${tieneGPS ? `<div class="zx_hist_fecha">GPS: ${limpiarTexto(i.latitud)}, ${limpiarTexto(i.longitud)}</div>` : ""}
        </div>
      `;
    }).join("");

  }catch(e){
    console.error(e);
    return `<div class="zx_error">Error cargando historial.</div>`;
  }
}

async function ZX_fichaje(){
  const historial=await cargarHistorial();

  $("app").innerHTML=`
    <div class="zx_card">
      <h2>Fichaje</h2>

      <div class="zx_text" style="margin-bottom:18px;">
        Usuario: <b>${limpiarTexto(usuarioActual())}</b>
      </div>

      ${estadoVisual()}

      <button class="zx_btn zx_verde" onclick="guardarFichaje('entrada')">Entrada</button>
      <button class="zx_btn zx_rojo" onclick="guardarFichaje('salida')">Salida</button>

      <button class="zx_btn zx_naranja" onclick="guardarFichaje('inicio_pausa')">Inicio pausa</button>
      <button class="zx_btn zx_gris" onclick="guardarFichaje('fin_pausa')">Fin pausa</button>

      <button class="zx_btn zx_naranja" onclick="guardarFichaje('inicio_comida')">Inicio comida</button>
      <button class="zx_btn zx_gris" onclick="guardarFichaje('fin_comida')">Fin comida</button>
    </div>

    <div class="zx_card">
      <h2>Historial</h2>
      ${historial}
    </div>
  `;
}

function ZX_usuarios(){
  $("app").innerHTML=`
    <div class="zx_card">
      <h2>Usuarios</h2>
      <div class="zx_text">Módulo usuarios pendiente.</div>
    </div>
  `;
}

async function ZX_vehiculos(){
  let html="";

  try{
    const res=await window.sb
      .from("vehiculos")
      .select("*")
      .order("matricula",{ascending:true});

    if(res.error){
      throw res.error;
    }

    if(!res.data || res.data.length===0){
      html=`<div class="zx_text">No hay vehículos.</div>`;
    }else{
      html=res.data.map(function(v){
        return `
          <div class="zx_hist_item">
            <div class="zx_hist_tipo">${limpiarTexto(v.matricula || "-")}</div>
            <div class="zx_hist_fecha">${limpiarTexto(v.marca || "")} ${limpiarTexto(v.modelo || "")}</div>
            <div class="zx_hist_fecha">Km: ${limpiarTexto(v.km_actual ?? 0)}</div>
            <div class="zx_hist_fecha">Estado: ${v.en_uso ? "En uso" : "Libre"}</div>
            ${v.usuario_asignado ? `<div class="zx_hist_fecha">Usuario: ${limpiarTexto(v.usuario_asignado)}</div>` : ""}
          </div>
        `;
      }).join("");
    }

  }catch(e){
    console.error(e);
    html=`<div class="zx_error">Error cargando vehículos.</div>`;
  }

  $("app").innerHTML=`
    <div class="zx_card">
      <h2>Vehículos</h2>
      ${html}
    </div>
  `;
}

function ZX_incidencias(){
  $("app").innerHTML=`
    <div class="zx_card">
      <h2>Incidencias</h2>
      <div class="zx_text">Módulo incidencias pendiente.</div>
    </div>
  `;
}

function ZX_informes(){
  $("app").innerHTML=`
    <div class="zx_card">
      <h2>Informes</h2>
      <div class="zx_text">Módulo informes pendiente.</div>
    </div>
  `;
}

pintarUsuarioFooter();
ZX_inicio();
</script>

</body>
</html>
