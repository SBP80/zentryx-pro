<script>

const SUPABASE_URL="https://idtaamivqbiuxtjywuux.supabase.co";

const SUPABASE_KEY="sb_publishable_ToDLKonbF2QnTXi56o1nfQ_10IdaPJx";

window.sb=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function actualizarReloj(){

  const ahora=new Date();

  document.getElementById("zx_fecha").textContent=
    ahora.toLocaleDateString(
      "es-ES",
      {
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );

  document.getElementById("zx_hora").textContent=
    ahora.toLocaleTimeString(
      "es-ES",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );
}

setInterval(actualizarReloj,1000);

actualizarReloj();

function logout(){

  localStorage.removeItem("usuario");

  location.href="index.html?v=2642";
}

function ZX_inicio(){

  document.getElementById("app").innerHTML=`

    <div class="zx_card">

      <h2>Inicio</h2>

      <div class="zx_text">
        Sistema principal Zentryx PRO modular activo.
      </div>

    </div>

    <div class="zx_card">

      <h2>Módulos rápidos</h2>

      <button class="zx_btn zx_rojo" onclick="ZX_fichaje()">
        Fichaje
      </button>

      <button class="zx_btn zx_azul" onclick="ZX_usuarios()">
        Usuarios
      </button>

      <button class="zx_btn zx_verde" onclick="ZX_vehiculos()">
        Vehículos
      </button>

      <button class="zx_btn zx_naranja" onclick="ZX_incidencias()">
        Incidencias
      </button>

      <button class="zx_btn zx_morado" onclick="ZX_informes()">
        Informes
      </button>

    </div>

    <div class="zx_card">

      <h2>Estado sistema</h2>

      <div class="zx_text">

        <b>Versión:</b> V2642

        <br><br>

        Historial real activo

        <br><br>

        Supabase conectado

      </div>

    </div>

  `;
}

async function guardarFichaje(tipo){

  try{

    const res=await window.sb
      .from("fichajes")
      .insert({
        usuario:"admin",
        tipo:tipo,
        empresa_id:"demo",
        fecha:new Date().toISOString()
      });

    if(res.error){
      throw res.error;
    }

    ZX_fichaje();

  }catch(e){

    alert("Error guardando fichaje: "+e.message);

    console.error(e);
  }
}

async function ZX_cargarHistorial(){

  const cont=document.getElementById("zx_historial");

  if(!cont) return;

  try{

    const res=await window.sb
      .from("fichajes")
      .select("*")
      .order("fecha",{ascending:false})
      .limit(20);

    if(res.error){
      throw res.error;
    }

    const datos=res.data || [];

    if(datos.length===0){

      cont.innerHTML=`
        <div class="zx_text">
          Sin fichajes todavía.
        </div>
      `;

      return;
    }

    cont.innerHTML=datos.map(f=>{

      const fecha=new Date(f.fecha);

      return `

        <div style="
          border:1px solid #d1d5db;
          border-radius:18px;
          padding:14px;
          margin-bottom:10px;
          background:white;
        ">

          <div style="
            font-size:18px;
            font-weight:900;
            margin-bottom:6px;
          ">
            ${f.tipo}
          </div>

          <div style="
            color:#6b7280;
            font-size:15px;
          ">
            ${fecha.toLocaleDateString("es-ES")}
            —
            ${fecha.toLocaleTimeString("es-ES")}
          </div>

        </div>

      `;

    }).join("");

  }catch(e){

    console.error(e);

    cont.innerHTML=`
      <div class="zx_text">
        Error cargando historial.
      </div>
    `;
  }
}

function ZX_fichaje(){

  document.getElementById("app").innerHTML=`

    <div class="zx_card">

      <h2>Fichaje</h2>

      <div class="zx_text" style="margin-bottom:14px;">
        Usuario: <b>admin</b>
      </div>

      <div class="zx_estado zx_estado_ok">
        Dentro
      </div>

      <button
        class="zx_btn zx_verde"
        onclick="guardarFichaje('Entrada')"
      >
        Entrada
      </button>

      <button
        class="zx_btn zx_rojo"
        onclick="guardarFichaje('Salida')"
      >
        Salida
      </button>

      <button
        class="zx_btn zx_naranja"
        onclick="guardarFichaje('Inicio pausa')"
      >
        Inicio pausa
      </button>

      <button
        class="zx_btn zx_naranja"
        onclick="guardarFichaje('Inicio comida')"
      >
        Inicio comida
      </button>

    </div>

    <div class="zx_card">

      <h2>Historial</h2>

      <div id="zx_historial">
        Cargando historial...
      </div>

    </div>

  `;

  ZX_cargarHistorial();
}

function ZX_usuarios(){

  document.getElementById("app").innerHTML=`

    <div class="zx_card">

      <h2>Usuarios</h2>

      <div class="zx_text">
        Módulo usuarios pendiente.
      </div>

    </div>

  `;
}

async function ZX_vehiculos(){

  const app=document.getElementById("app");

  app.innerHTML=`

    <div class="zx_card">

      <h2>Vehículos</h2>

      <button
        class="zx_btn zx_azul"
        onclick="ZX_vehiculos()"
      >
        Recargar
      </button>

      <div id="zx_lista_vehiculos">
        Cargando...
      </div>

    </div>

  `;

  const cont=document.getElementById("zx_lista_vehiculos");

  try{

    const res=await window.sb
      .from("vehiculos")
      .select("*")
      .order("created_at",{ascending:false});

    if(res.error){
      throw res.error;
    }

    const datos=res.data || [];

    if(datos.length===0){

      cont.innerHTML=`
        <div class="zx_text">
          No hay vehículos.
        </div>
      `;

      return;
    }

    cont.innerHTML=datos.map(v=>`

      <div style="
        border:1px solid #d1d5db;
        border-radius:18px;
        padding:16px;
        margin-top:12px;
      ">

        <div style="
          font-size:22px;
          font-weight:900;
          margin-bottom:8px;
        ">
          ${v.matricula || "-"}
        </div>

        <div style="
          font-size:16px;
          color:#374151;
          margin-bottom:10px;
        ">
          Kilómetros: ${v.km_actual || 0}
        </div>

        <div style="
          display:inline-block;
          padding:8px 13px;
          border-radius:999px;
          background:${v.en_uso ? '#fee2e2' : '#dcfce7'};
          color:${v.en_uso ? '#991b1b' : '#166534'};
          font-weight:900;
        ">
          ${v.en_uso ? 'En uso' : 'Libre'}
        </div>

      </div>

    `).join("");

  }catch(e){

    console.error(e);

    cont.innerHTML=`
      <div class="zx_text">
        Error cargando vehículos.
      </div>
    `;
  }
}

function ZX_incidencias(){

  document.getElementById("app").innerHTML=`

    <div class="zx_card">

      <h2>Incidencias</h2>

      <div class="zx_text">
        Módulo incidencias pendiente.
      </div>

    </div>

  `;
}

function ZX_informes(){

  document.getElementById("app").innerHTML=`

      <div class="zx_text">

      </div>

  `;
}

ZX_inicio();

</script>
