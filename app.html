<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Zentryx PRO V2655</title>

<script>
const ZX_VERSION="2655";

function checkLogin(){
  const s=localStorage.getItem("zentryx_session");
  if(!s){
    location.replace("index.html?v="+ZX_VERSION);
    return false;
  }
  try{
    JSON.parse(s);
    return true;
  }catch(e){
    localStorage.removeItem("zentryx_session");
    localStorage.removeItem("usuario");
    location.replace("index.html?v="+ZX_VERSION);
    return false;
  }
}

checkLogin();
</script>
</head>

<body>

<div id="app"></div>

<script src="src/ui/layout.js?v=2655"></script>
<script src="src/modules/inicio.js?v=2655"></script>
<script src="src/modules/usuarios.js?v=2655"></script>

<script>
document.addEventListener("DOMContentLoaded",function(){
  if(!checkLogin()) return;

  if(window.ZENTRYX_UI_LAYOUT){
    window.ZENTRYX_UI_LAYOUT.iniciar();
  }

  if(window.ZX_inicio){
    window.ZX_inicio();
  }
});
</script>

</body>
</html>
