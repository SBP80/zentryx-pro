<script>
(function(){
"use strict";
let iniciado=false;

function mostrarErrorArranque(){
  const app=document.getElementById("app");
  if(!app) return;
  app.innerHTML=""+
    "<main style='min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a'>"+
      "<section style='width:min(430px,100%);padding:24px;border:1px solid #e2e8f0;border-radius:18px;background:white;box-shadow:0 12px 35px rgba(15,23,42,.08);text-align:center'>"+
        "<h1 style='font-size:20px;margin:0 0 10px'>No se ha podido iniciar Zentryx PRO</h1>"+
        "<p style='margin:0 0 18px;line-height:1.5;color:#475569'>Comprueba la conexión y vuelve a intentarlo.</p>"+
        "<button type='button' onclick='location.reload()' style='border:0;border-radius:12px;padding:12px 18px;background:#2563eb;color:white;font-weight:700'>Reintentar</button>"+
      "</section>"+
    "</main>";
}

async function comprobarVersionPublicada(){
  if(!navigator.onLine) return false;
  try{
    const r=await fetch("app.html?zx_version_probe="+Date.now(),{cache:"no-store"});
    if(!r.ok) return false;
    const html=await r.text();
    const m=html.match(/window\.ZX_VERSION\s*=\s*["'](\d+)["']/);
    const publicada=m?Number(m[1]):0;
    const actual=Number(window.ZX_VERSION||0);
    if(publicada>actual){
      location.replace("app.html?v="+publicada+"&t="+Date.now());
      return true;
    }
  }catch(e){}
  return false;
}

async function iniciar(){
  if(iniciado) return;
  if(await comprobarVersionPublicada()) return;
  if(typeof window.ZENTRYX_sessionValid!=="function" || !window.ZENTRYX_sessionValid()){
    if(typeof window.ZENTRYX_logout==="function") window.ZENTRYX_logout();
    else location.replace("index.html?v="+window.ZX_VERSION+"&t="+Date.now());
    return;
  }
  if(!window.sb || !window.ZENTRYX_UI_LAYOUT || typeof window.ZENTRYX_UI_LAYOUT.iniciar!=="function"){
    mostrarErrorArranque();
    return;
  }

  iniciado=true;

  if(window.ZENTRYX && typeof window.ZENTRYX.refrescarAccesoUsuarioActual==="function"){
    await window.ZENTRYX.refrescarAccesoUsuarioActual();
  }
  if(window.ZENTRYX && typeof window.ZENTRYX.cargarConfigEmpresa==="function"){
    await window.ZENTRYX.cargarConfigEmpresa();
  }

  window.ZENTRYX_UI_LAYOUT.iniciar();
  if(typeof window.ZX_inicio==="function") window.ZX_inicio();
  if(window.ZENTRYX && typeof window.ZENTRYX.actualizarEstadoConexion==="function"){
    window.ZENTRYX.actualizarEstadoConexion();
  }
  if(typeof window.ZENTRYX_updateActivity==="function"){
    window.ZENTRYX_updateActivity(true);
  }
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",iniciar,{once:true});
}else{
  iniciar();
}
})();
</script>

<script>
(function(){
  "use strict";

  const ROOT_SELECTOR=[
    "#zx_modal_agenda",
    "#zx_modal_cliente",
    "#zx_modal_trabajo",
    "#zx_modal_fichaje",
    "#zx_modal_festivo",
    "#zx_modal_vehiculo",
    "#zx_modal_convenio",
    "#zx_pr_modal",
    "#zx_modal",
    "#zx_al_modal",
    ".zx_modal_fondo",
    ".zx_al_modal",
    ".zx_md_map_modal"
  ].join(",");

  function texto(el){
    return String((el && (el.innerText || el.textContent)) || "")
      .replace(/\s+/g," ")
      .trim();
  }

  function tipoAccion(t){
    const s=String(t||"").toLowerCase();
    if(/\bguardar\b/.test(s)) return "guardar";
    if(/\beditar\b|^✏/.test(s)) return "editar";
    if(/\bvolver\b|^←|^‹/.test(s)) return "volver";
    if(/\bcancelar\b/.test(s)) return "cancelar";
    if(/\bcerrar\b|^✕|^×/.test(s)) return "cerrar";
    return "";
  }

  function cajaDe(root){
    if(!root) return null;
    return root.querySelector(":scope > .zx_modal_caja, :scope > .zx_al_modal_box, :scope > .zx_pr_modal_box, .zx_modal_caja, .zx_al_modal_box, .zx_pr_modal_box") || root.firstElementChild || root;
  }

  function cabeceraPropia(root,caja){
    if(!root||!caja) return null;
    if(root.id==="zx_modal_trabajo") return caja.querySelector(".zx_tr_full_header,.zx_tr_part_full_header,.zx_tr_modal_topbar");
    if(root.id==="zx_modal_cliente") return caja.querySelector(".zx_cli_top_actions");
    if(root.id==="zx_modal_vehiculo") return caja.querySelector(".zx_modal_top_actions");
    if(root.id==="zx_pr_modal") return caja.querySelector(".zx_pr_top_actions");
    return caja.querySelector(".zx_user_top_actions,.zx_lab_top,.zx_modal_top_actions");
  }

  function completarCabeceraPropia(caja,cabecera){
    if(!caja||!cabecera) return;
    const accionesCabecera=Array.from(cabecera.querySelectorAll("button,a,[role='button']"))
      .filter(function(el){return !el.hasAttribute("data-zx-top-mirror");})
      .map(function(el){return tipoAccion(texto(el));})
      .filter(Boolean);
    if(accionesCabecera.includes("guardar") || accionesCabecera.includes("editar")){
      const espejoPrevio=cabecera.querySelector("[data-zx-top-mirror]");
      if(espejoPrevio) espejoPrevio.remove();
      cabecera.classList.remove("zx_global_completed_top");
      return;
    }

    const candidatos=Array.from(caja.querySelectorAll("button,a,[role='button']"))
      .filter(function(el){
        if(el.closest(".zx_global_top_actions") || cabecera.contains(el)) return false;
        const tipo=tipoAccion(texto(el));
        return tipo==="guardar" || tipo==="editar";
      });
    const original=candidatos.find(function(el){return tipoAccion(texto(el))==="guardar";})
      || candidatos.find(function(el){return tipoAccion(texto(el))==="editar";});
    if(!original){
      const espejoPrevio=cabecera.querySelector("[data-zx-top-mirror]");
      if(espejoPrevio) espejoPrevio.remove();
      cabecera.classList.remove("zx_global_completed_top");
      return;
    }

    const tipo=tipoAccion(texto(original));
    let espejo=cabecera.querySelector("[data-zx-top-mirror]");
    if(!espejo){
      espejo=document.createElement("button");
      espejo.type="button";
      espejo.setAttribute("data-zx-top-mirror","1");
      cabecera.appendChild(espejo);
    }
    espejo.textContent=tipo==="guardar" ? "Guardar" : "Editar";
    espejo.onclick=function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      if(original && original.isConnected && !original.disabled) original.click();
    };
    cabecera.classList.add("zx_global_completed_top");
  }

  function instalarEn(root){
    if(!root || !root.isConnected) return;
    const caja=cajaDe(root);
    if(!caja) return;

    const propia=cabeceraPropia(root,caja);
    if(propia){
      const previa=caja.querySelector(":scope > .zx_global_top_actions");
      if(previa) previa.remove();
      completarCabeceraPropia(caja,propia);
      return;
    }

    const existente=caja.querySelector(":scope > .zx_global_top_actions");
    if(existente) return;

    const candidatos=Array.from(caja.querySelectorAll("button,a,[role='button']"))
      .filter(function(el){
        if(el.closest(".zx_global_top_actions")) return false;
        return !!tipoAccion(texto(el));
      });

    const porTipo={};
    candidatos.forEach(function(el){
      const tipo=tipoAccion(texto(el));
      if(tipo && !porTipo[tipo]) porTipo[tipo]=el;
    });

    const salida=porTipo.volver ? "volver" : porTipo.cancelar ? "cancelar" : porTipo.cerrar ? "cerrar" : "";
    const principal=porTipo.guardar ? "guardar" : porTipo.editar ? "editar" : "";
    const disponibles=[salida,principal].filter(Boolean);
    if(!disponibles.length) return;

    const bar=document.createElement("div");
    bar.className="zx_global_top_actions";
    bar.setAttribute("data-zx-global-actions","1");
    if(disponibles.length===1) bar.style.gridTemplateColumns="1fr";

    disponibles.forEach(function(tipo){
      const original=porTipo[tipo];
      const b=document.createElement("button");
      b.type="button";
      b.setAttribute("data-zx-global-action",tipo);
      b.textContent=texto(original) || ({cerrar:"Cerrar",cancelar:"Cancelar",volver:"← Volver",guardar:"Guardar",editar:"Editar"}[tipo]||tipo);
      b.onclick=function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        if(original && original.isConnected){ original.click(); return; }
        const reemplazo=Array.from(caja.querySelectorAll("button,a,[role='button']"))
          .find(function(x){return tipoAccion(texto(x))===tipo && !x.closest(".zx_global_top_actions")});
        if(reemplazo) reemplazo.click();
      };
      bar.appendChild(b);
    });

    caja.insertBefore(bar,caja.firstChild);
  }

  function unidadVisible(v){
    const raw=String(v||"").trim();
    const k=raw.toLowerCase().replace(/\s+/g,"");
    const mapa={
      "mm2":"mm²","cm2":"cm²","m2":"m²",
      "mm3":"mm³","cm3":"cm³","m3":"m³",
      "m3/h":"m³/h","w/m2k":"W/m²K",
      "l":"L","lt":"L","litro":"L","litros":"L",
      "u":"ud","uds":"ud","unidad":"ud","unidades":"ud"
    };
    return mapa[k]||raw;
  }

  function aplicarUnidad(input){
    if(!input || !input.isConnected) return;
    const unidad=unidadVisible(input.getAttribute("data-zx-unit"));
    let wrap=input.parentElement && input.parentElement.classList.contains("zx_global_num_unit_wrap") ? input.parentElement : null;
    if(!unidad){
      if(wrap){
        const parent=wrap.parentNode;
        parent.insertBefore(input,wrap);
        wrap.remove();
      }
      return;
    }
    if(!wrap){
      wrap=document.createElement("div");
      wrap.className="zx_global_num_unit_wrap";
      input.parentNode.insertBefore(wrap,input);
      wrap.appendChild(input);
      const span=document.createElement("span");
      span.className="zx_global_num_unit";
      wrap.appendChild(span);
    }
    const span=wrap.querySelector(".zx_global_num_unit");
    if(span) span.textContent=unidad;
  }

  function aplicarUnidades(root){
    (root||document).querySelectorAll("input[data-zx-unit]").forEach(aplicarUnidad);
  }

  window.ZENTRYX_setInputUnit=function(ref,unidad){
    const input=typeof ref==="string" ? document.getElementById(ref) : ref;
    if(!input) return;
    const valor=unidadVisible(unidad);
    if(valor) input.setAttribute("data-zx-unit",valor);
    else input.removeAttribute("data-zx-unit");
    aplicarUnidad(input);
  };

  function revisar(){
    document.querySelectorAll(ROOT_SELECTOR).forEach(instalarEn);
    aplicarUnidades(document);
  }

  let pendiente=false;
  function programar(){
    if(pendiente) return;
    pendiente=true;
    requestAnimationFrame(function(){
      pendiente=false;
      revisar();
    });
  }

  const obs=new MutationObserver(programar);
  obs.observe(document.documentElement,{childList:true,subtree:true});

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",revisar,{once:true});
  }else{
    revisar();
  }
})();
</script>
