<script>
const ZX_VERSION="3121";

function checkLogin(){
  const raw=localStorage.getItem("zentryx_session");

  if(!raw){
    location.replace("index.html?v="+ZX_VERSION);
    return false;
  }

  try{
    const ses=JSON.parse(raw);

    if(!ses || !ses.id || !ses.usuario){
      throw new Error("Sesión inválida");
    }

    return true;

  }catch(e){
    localStorage.removeItem("zentryx_session");
    localStorage.removeItem("usuario");
    location.replace("index.html?v="+ZX_VERSION);
    return false;
  }
}

checkLogin();
</script>

function iniciar(){

  if(window.ZX_inicio){
