<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Zentryx PRO V2646</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  background:#eef2f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:#0f172a;
  overflow-x:hidden;
}

body{padding-bottom:170px}

#app{
  padding:16px;
}
</style>
</head>

<body>

<div id="app"></div>

<!-- ===============================
     CORE
================================ -->
<script src="src/app.js"></script>
<script src="src/core/session.js"></script>
<script src="src/core/store.js"></script>

<!-- ===============================
     UI
================================ -->
<script src="src/ui/layout.js"></script>

<!-- ===============================
     MÓDULOS
================================ -->
<script src="src/modules/inicio.js"></script>
<script src="src/modules/fichajes.js"></script>
<script src="src/modules/vehiculos.js"></script>
<script src="src/modules/usuarios.js"></script>

<!-- (preparados para futuro) -->
<script src="src/modules/configuracion.js"></script>

<script>
/*
===============================
ARRANQUE CONTROLADO
===============================
*/

(function(){

  function iniciar(){

    if(!window.ZENTRYX){
      console.error("ZENTRYX no cargado");
      return;
    }

    console.log("Arranque Zentryx PRO", window.ZENTRYX.estadoSistema());

    // Cargar inicio automáticamente
    if(window.ZX_inicio){
      window.ZX_inicio();
    }

  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",iniciar);
  }else{
    iniciar();
  }

})();
</script>

</body>
</html>
