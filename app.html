<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Zentryx PRO V2654</title>

<script>
const ZX_VERSION="2654";

function checkLogin(){
  const session=localStorage.getItem("zentryx_session");
  if(!session){
    location.replace("index.html?v="+ZX_VERSION);
    return false;
  }
  try{
    JSON.parse(session);
    return true;
  }catch{
    localStorage.removeItem("zentryx_session");
    location.replace("index.html?v="+ZX_VERSION);
    return false;
  }
}

checkLogin();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="app"></div>

<script src="src/ui/layout.js?v=2654"></script>
<script src="src/modules/inicio.js?v=2654"></script>
<script src="src/modules/usuarios.js?v=2654"></script>

<script>
document.addEventListener("DOMContentLoaded",function(){
  if(!checkLogin()) return;

  if(window.ZENTRYX_UI_LAYOUT){
    window.ZENTRYX_UI_LAYOUT.iniciar();
  }

  if(window.ZX_inicio){
    window.ZX_inicio();
  }
});
</script>

</body>
</html>
