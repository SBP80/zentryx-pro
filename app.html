<script>
const ZX_VERSION="3093";

function checkLogin(){
  const s=localStorage.getItem("zentryx_session");

  if(!s){
    location.replace("index.html?v="+ZX_VERSION);
    return false;
  }

  try{
    const ses=JSON.parse(s);

    if(!ses.id || !ses.usuario){
      throw "sesión inválida";
    }

    return true;

  }catch(e){

    localStorage.removeItem("zentryx_session");
    localStorage.removeItem("usuario");

    location.replace("index.html?v="+ZX_VERSION);
    return false;
  }
}

checkLogin();
</script>
