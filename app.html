<script>
const ZX_VERSION="3101";

function checkLogin(){
  const raw=localStorage.getItem("zentryx_session");

  if(!raw){
    location.replace("index.html?v="+ZX_VERSION);
    return false;
  }

  try{
    const ses=JSON.parse(raw);

    if(!ses || !ses.id || !ses.usuario){
      throw new Error("Sesión inválida");
    }

    return true;

  }catch(e){
    localStorage.removeItem("zentryx_session");
    localStorage.removeItem("usuario");
    location.replace("index.html?v="+ZX_VERSION);
    return false;
  }
}

checkLogin();
</script>

<script>
(function(){
"use strict";

function estado(){
  return document.getElementById("zx_connection_status");
}

function setEstado(tipo,texto){
  const el=estado();
  if(!el) return;

  el.className="";
  if(tipo) el.classList.add(tipo);
  el.textContent=texto;
}

function refrescarConexion(){
  if(!navigator.onLine){
    setEstado("zx_offline","🟡 Sin conexión");
    return;
  }

  setEstado("zx_synced","✅ Sincronizado");

  setTimeout(function(){
    if(navigator.onLine){
      setEstado("zx_synced","🟢 Conectado");
    }
  },1200);
}

window.ZENTRYX_SET_SYNC_STATUS=function(tipo){
  if(tipo==="syncing"){
    setEstado("zx_syncing","🔄 Sincronizando");
    return;
  }

  if(tipo==="offline"){
    setEstado("zx_offline","🟡 Sin conexión");
    return;
  }

  if(tipo==="synced"){
    setEstado("zx_synced","✅ Sincronizado");
    return;
  }

  refrescarConexion();
};

window.addEventListener("online",function(){
  setEstado("zx_syncing","🔄 Sincronizando");
  setTimeout(refrescarConexion,700);
});

window.addEventListener("offline",function(){
  setEstado("zx_offline","🟡 Sin conexión");
});

document.addEventListener("DOMContentLoaded",function(){
  if(!checkLogin()) return;

  refrescarConexion();

  if(window.ZENTRYX_UI_LAYOUT){
    window.ZENTRYX_UI_LAYOUT.iniciar();
  }

  if(window.ZX_inicio){
    window.ZX_inicio();
  }
});

})();
</script>
