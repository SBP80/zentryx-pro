<script>
(function(){
"use strict";
let iniciado=false;

function mostrarErrorArranque(){
  const app=document.getElementById("app");
  if(!app) return;
  app.innerHTML=""+
    "<main style='min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a'>"+
      "<section style='width:min(430px,100%);padding:24px;border:1px solid #e2e8f0;border-radius:18px;background:white;box-shadow:0 12px 35px rgba(15,23,42,.08);text-align:center'>"+
        "<h1 style='font-size:20px;margin:0 0 10px'>No se ha podido iniciar Zentryx PRO</h1>"+
        "<p style='margin:0 0 18px;line-height:1.5;color:#475569'>Comprueba la conexión y vuelve a intentarlo.</p>"+
        "<button type='button' onclick='location.reload()' style='border:0;border-radius:12px;padding:12px 18px;background:#2563eb;color:white;font-weight:700'>Reintentar</button>"+
      "</section>"+
    "</main>";
}

async function iniciar(){
  if(iniciado) return;
  if(typeof window.ZENTRYX_sessionValid!=="function" || !window.ZENTRYX_sessionValid()){
    if(typeof window.ZENTRYX_logout==="function") window.ZENTRYX_logout();
    else location.replace("index.html?v="+window.ZX_VERSION+"&t="+Date.now());
    return;
  }
  if(!window.sb || !window.ZENTRYX_UI_LAYOUT || typeof window.ZENTRYX_UI_LAYOUT.iniciar!=="function"){
    mostrarErrorArranque();
    return;
  }

  iniciado=true;

  if(window.ZENTRYX && typeof window.ZENTRYX.refrescarAccesoUsuarioActual==="function"){
    await window.ZENTRYX.refrescarAccesoUsuarioActual();
  }
  if(window.ZENTRYX && typeof window.ZENTRYX.cargarConfigEmpresa==="function"){
    await window.ZENTRYX.cargarConfigEmpresa();
  }

  window.ZENTRYX_UI_LAYOUT.iniciar();
  if(typeof window.ZX_inicio==="function") window.ZX_inicio();
  if(window.ZENTRYX && typeof window.ZENTRYX.actualizarEstadoConexion==="function"){
    window.ZENTRYX.actualizarEstadoConexion();
  }
  if(typeof window.ZENTRYX_updateActivity==="function"){
    window.ZENTRYX_updateActivity(true);
  }
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",iniciar,{once:true});
}else{
  iniciar();
}
})();
</script>

<!-- ZENTRYX PRO V3301 - ACCIONES SUPERIORES GLOBALES EN VISTAS LARGAS -->
<style id="zx-global-top-actions-style">

    color:#fff;
  }
  .zx_global_top_actions button[data-zx-global-action="volver"]{
    border-color:#cbd5e1;
    background:#fff;
  }
  #zx_modal_trabajo.zx_tr_fullscreen .zx_global_top_actions,
  #zx_modal_trabajo:has(.zx_tr_full_header) .zx_global_top_actions{display:none!important}
  @media(max-width:560px){
    .zx_global_top_actions{padding-top:5px;gap:6px}
    .zx_global_top_actions button{padding:8px 10px;font-size:.84rem}
  }
</style>
<script>
(function(){
  "use strict";

  const ROOT_SELECTOR=[
    "#zx_modal_agenda",
    "#zx_modal_cliente",
    "#zx_modal_trabajo",
    "#zx_modal_fichaje",
    "#zx_modal_festivo",
    "#zx_modal",
    "#zx_al_modal",
    ".zx_modal_fondo",
    ".zx_al_modal",
    ".zx_md_map_modal"
  ].join(",");

  function texto(el){
    return String((el && (el.innerText || el.textContent)) || "")
      .replace(/\\s+/g," ")
      .trim();
  }

  function tipoAccion(t){
    const s=String(t||"").toLowerCase();
    if(/\\bcerrar\\b|^✕|^×/.test(s)) return "cerrar";
    if(/\\bvolver\\b|^←/.test(s)) return "volver";
    if(/\\beditar\\b|^✏/.test(s)) return "editar";
    return "";
  }

  function cajaDe(root){
    if(!root) return null;
    return root.querySelector(":scope > .zx_modal_caja, :scope > .zx_al_modal_box, .zx_modal_caja, .zx_al_modal_box") || root.firstElementChild || root;
  }

  function instalarEn(root){
    if(!root || !root.isConnected) return;
    if(root.id==="zx_modal_vehiculo" || root.querySelector(".zx_modal_top_actions")) return;

    const caja=cajaDe(root);
    if(!caja) return;

    // Las vistas que ya tienen su propia cabecera superior no necesitan
    // una segunda barra global de Volver/Editar/Guardar.
    if(root.id==="zx_modal_trabajo" && caja.querySelector(".zx_tr_full_header")){
      const previa=caja.querySelector(":scope > .zx_global_top_actions");
      if(previa) previa.remove();
      return;
    }
    if(root.id==="zx_modal_cliente" && caja.querySelector(".zx_cli_top_actions")){
      const previa=caja.querySelector(":scope > .zx_global_top_actions");
      if(previa) previa.remove();
      return;
    }
    if(root.id==="zx_modal" && caja.querySelector(".zx_user_top_actions")){
      const previa=caja.querySelector(":scope > .zx_global_top_actions");
      if(previa) previa.remove();
      return;
    }

    if(caja.querySelector(":scope > .zx_global_top_actions")) return;

    const candidatos=Array.from(caja.querySelectorAll("button,a,[role='button']"))
      .filter(function(el){
        if(el.closest(".zx_global_top_actions")) return false;
        const tipo=tipoAccion(texto(el));
        return !!tipo;
      });

    const porTipo={};
    candidatos.forEach(function(el){
      const tipo=tipoAccion(texto(el));
      if(tipo && !porTipo[tipo]) porTipo[tipo]=el;
    });

    const orden=["volver","editar","cerrar"];
    const disponibles=orden.filter(function(k){return !!porTipo[k]});
    if(!disponibles.length) return;

    const bar=document.createElement("div");
    bar.className="zx_global_top_actions";
    bar.setAttribute("data-zx-global-actions","1");

    disponibles.forEach(function(tipo){
      const original=porTipo[tipo];
      const b=document.createElement("button");
      b.type="button";
      b.setAttribute("data-zx-global-action",tipo);
      b.textContent=texto(original) || (tipo==="cerrar"?"Cerrar":tipo==="volver"?"Volver":"Editar");
      b.onclick=function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        if(original && original.isConnected){ original.click(); return; }
        const reemplazo=Array.from(caja.querySelectorAll("button,a,[role='button']"))
          .find(function(x){return tipoAccion(texto(x))===tipo && !x.closest(".zx_global_top_actions")});
        if(reemplazo) reemplazo.click();
      };
      bar.appendChild(b);
    });

    caja.insertBefore(bar,caja.firstChild);
  }

  function revisar(){
    document.querySelectorAll(ROOT_SELECTOR).forEach(instalarEn);
  }

  let pendiente=false;
  function programar(){
    if(pendiente) return;
    pendiente=true;
    requestAnimationFrame(function(){
      pendiente=false;
      revisar();
    });
  }

  const obs=new MutationObserver(programar);
  obs.observe(document.documentElement,{childList:true,subtree:true});

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",revisar,{once:true});
  }else{
    revisar();
  }
})();
</script>
