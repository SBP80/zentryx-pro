<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta

/>

<title>Zentryx PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{

  background:#e9eef3;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:#0f172a;

  overflow-x:hidden;
}

/* ===================================== */
/* APP */
/* ===================================== */

#app{

  min-height:100vh;

  padding-bottom:220px;
}

/* ===================================== */
/* HEADER */
/* ===================================== */

#zx_top{

  background:#02163a;

  padding:
    26px
    22px
    34px;

  color:white;
}

#zx_top h1{

  font-size:38px;

  font-weight:900;

  margin-bottom:14px;
}

#zx_fecha{

  font-size:22px;

  opacity:0.8;

  margin-bottom:20px;
}

#zx_hora{

  font-size:62px;

  font-weight:900;

  margin-bottom:28px;
}

#zx_logout{

  width:100%;

  border:0;

  border-radius:22px;

  background:#ef2026;

  color:white;

  padding:22px;

  font-size:30px;

  font-weight:900;
}

/* ===================================== */
/* TARJETAS */
/* ===================================== */

.zx_card{

  background:white;

  margin:22px;

  border-radius:28px;

  padding:28px;

  border:1px solid #d4dbe3;

  box-shadow:
    0 4px 16px rgba(0,0,0,0.04);
}

.zx_card h2{

  font-size:36px;

  margin-bottom:20px;

  font-weight:900;
}

/* ===================================== */
/* BOTONES */
/* ===================================== */

.zx_btn{

  width:100%;

  border:0;

  border-radius:22px;

  padding:22px;

  margin-bottom:16px;

  color:white;

  font-size:24px;

  font-weight:900;
}

.zx_rojo{
  background:#ef2026;
}

.zx_azul{
  background:#3464e8;
}

.zx_verde{
  background:#1fad49;
}

.zx_naranja{
  background:#f97316;
}

.zx_morado{
  background:#7c3aed;
}

/* ===================================== */
/* FOOTER */
/* ===================================== */

#zx_footer{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  background:#02163a;

  border-top:1px solid rgba(255,255,255,0.08);

  padding-top:10px;
  padding-bottom:10px;

  z-index:9999;

  backdrop-filter:blur(20px);

  box-shadow:
    0 -10px 30px rgba(0,0,0,0.35);
}

/* CABECERA */

#zx_footer_top{

  display:flex;

  align-items:center;

  gap:12px;

  padding-left:16px;
  padding-right:16px;

  padding-bottom:10px;
}

#zx_footer_logo{

  width:56px;
  height:56px;

  border-radius:16px;

  background:linear-gradient(
    135deg,
    #3b82f6,
    #10b981
  );

  display:flex;

  align-items:center;
  justify-content:center;

  color:white;

  font-size:34px;

  font-weight:900;
}

#zx_footer_info{

  flex:1;
}

#zx_footer_info h3{

  margin:0;

  color:white;

  font-size:18px;

  font-weight:800;
}

#zx_footer_info p{

  margin-top:2px;

  color:rgba(255,255,255,0.7);

  font-size:13px;
}

/* MENÚ */

#zx_footer_menu{

  display:flex;

  gap:10px;

  overflow-x:auto;

  padding-left:16px;
  padding-right:16px;

  padding-top:10px;

  -webkit-overflow-scrolling:touch;

  scrollbar-width:none;
}

#zx_footer_menu::-webkit-scrollbar{
  display:none;
}

.zx_footer_btn{

  flex:none;

  border:0;

  border-radius:18px;

  background:rgba(255,255,255,0.12);

  color:white;

  padding:14px 22px;

  font-size:16px;

  font-weight:800;

  min-width:140px;
}

.zx_footer_btn:active{

  transform:scale(0.96);

  background:#2563eb;
}

</style>
