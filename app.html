<script>
const SUPABASE_URL="https://idtaamivqbiuxtjywuux.supabase.co";
const SUPABASE_KEY="sb_publishable_ToDLKonbF2QnTXi56o1nfQ_10IdaPJx";

window.sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function actualizarReloj(){

  const ahora=new Date();

  document.getElementById("zx_fecha").textContent=
    ahora.toLocaleDateString("es-ES",{
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    });

  document.getElementById("zx_hora").textContent=
    ahora.toLocaleTimeString("es-ES",{
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    });
}

setInterval(actualizarReloj,1000);
actualizarReloj();

function logout(){
  localStorage.removeItem("usuario");
  location.href="index.html?v=2643";
}

function ZX_inicio(){

  document.getElementById("app").innerHTML=`

    <div class="zx_card">
      <h2>Inicio</h2>

      <div class="zx_text">
        Sistema principal Zentryx PRO modular activo.
      </div>
    </div>

    <div class="zx_card">
      <h2>Módulos rápidos</h2>

      <button class="zx_btn zx_rojo" onclick="ZX_fichaje()">
        Fichaje
      </button>

      <button class="zx_btn zx_azul" onclick="ZX_usuarios()">
        Usuarios
      </button>

      <button class="zx_btn zx_verde" onclick="ZX_vehiculos()">
        Vehículos
      </button>

      <button class="zx_btn zx_naranja" onclick="ZX_incidencias()">
        Incidencias
      </button>

      <button class="zx_btn zx_morado" onclick="ZX_informes()">
        Informes
      </button>
    </div>

  `;
}

async function guardarFichaje(tipo){

  try{

    const estado=localStorage.getItem("zx_estado") || "fuera";

    if(tipo==="entrada" && estado==="dentro"){
      alert("Ya estás dentro");
      return;
    }

    if(tipo!=="entrada" && estado==="fuera"){
      alert("Primero debes hacer entrada");
      return;
    }

    if(tipo==="salida"){

      const tieneVehiculo=confirm("¿Tienes vehículo asignado?");

      if(tieneVehiculo){

        const km=prompt("Introduce kilómetros actuales");

        if(!km) return;

        localStorage.setItem("zx_km",km);
      }
    }

    const datos={
      tipo:tipo,
      fecha:new Date().toISOString()
    };

    const res=await window.sb
      .from("fichajes")
      .insert([datos]);

    if(res.error){
      throw res.error;
    }

    if(tipo==="entrada"){
      localStorage.setItem("zx_estado","dentro");
    }

    if(tipo==="salida"){
      localStorage.setItem("zx_estado","fuera");
    }

    ZX_fichaje();

  }catch(e){

    alert("Error guardando fichaje: "+e.message);
  }
}

async function cargarHistorial(){

  try{

    const res=await window.sb
      .from("fichajes")
      .select("*")
      .order("fecha",{ascending:false})
      .limit(10);

    if(res.error){
      throw res.error;
    }

    const datos=res.data || [];

    if(datos.length===0){
      return `<div class="zx_text">Sin fichajes</div>`;
    }

    return datos.map(i=>`

      <div class="zx_hist_item">

        <div class="zx_hist_tipo">
          ${i.tipo}
        </div>

        <div class="zx_hist_fecha">
          ${new Date(i.fecha).toLocaleString("es-ES")}
        </div>

      </div>

    `).join("");

  }catch(e){

    return `
      <div class="zx_text">
        Error cargando historial.
      </div>
    `;
  }
}

async function ZX_fichaje(){

  const estado=localStorage.getItem("zx_estado") || "fuera";

  const historial=await cargarHistorial();

  document.getElementById("app").innerHTML=`

    <div class="zx_card">

      <h2>Fichaje</h2>

      <div class="zx_text" style="margin-bottom:18px;">
        Usuario: <b>admin</b>
      </div>

      <div class="zx_estado ${estado==="dentro" ? "zx_dentro" : "zx_fuera"}">
        ${estado==="dentro" ? "Dentro" : "Fuera"}
      </div>

      <button
        class="zx_btn zx_verde"
        onclick="guardarFichaje('entrada')"
      >
        Entrada
      </button>

      <button
        class="zx_btn zx_rojo"
        onclick="guardarFichaje('salida')"
      >
        Salida
      </button>

      <button
        class="zx_btn zx_naranja"
        onclick="guardarFichaje('inicio pausa')"
      >
        Inicio pausa
      </button>

      <button
        class="zx_btn zx_naranja"
        onclick="guardarFichaje('inicio comida')"
      >
        Inicio comida
      </button>

    </div>

    <div class="zx_card">

      <h2>Historial</h2>

      ${historial}

    </div>

  `;
}

</script>
