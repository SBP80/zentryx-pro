<!DOCTYPE html>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#071330;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:white;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  overflow-x:hidden;
}

.login_wrap{
  width:100%;
  max-width:480px;
}

.brand{
  text-align:center;
  margin-bottom:26px;
}

.logo{
  width:96px;
  height:96px;
  border-radius:28px;
  margin:0 auto 18px;
  background:linear-gradient(135deg,#2563eb,#10b981);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:56px;
  font-weight:900;
  box-shadow:0 18px 45px rgba(0,0,0,.35);
}

.brand h1{
  margin:0;
  font-size:38px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand p{
  margin:8px 0 0;
  color:#cbd5e1;
  font-size:16px;
  font-weight:800;
}

.box{
  width:100%;
  background:white;
  color:#0f172a;
  border-radius:30px;
  padding:26px;
  box-shadow:0 22px 70px rgba(0,0,0,.38);
}

.box h2{
  margin:0 0 10px;

}

  color:#64748b;

}

label{
  display:block;
  margin:16px 0 7px;
  color:#334155;
  font-size:15px;
  font-weight:900;
}

input{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:18px;
  padding:18px;

  font-weight:800;

  background:#f8fafc;

}

input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 4px rgba(37,99,235,.15);

}

.pin{
  text-align:center;
  font-size:34px;
  letter-spacing:12px;

}

.btn{
  width:100%;
  border:0;
  border-radius:20px;
  padding:18px;
  margin-top:18px;
  font-size:21px;
  font-weight:900;
  color:white;
  background:#2563eb;
}

.btn:active{
  transform:scale(.99);
}

.btn:disabled{
  opacity:.55;
  transform:none;
}

.btn_sec{

}

.msg{
  display:none;
  margin-top:16px;

}

.msg.ok{
  background:#dcfce7;

}

.msg.info{
  background:#eff6ff;
  color:#1d4ed8;
}

.footer{
  text-align:center;
  margin-top:18px;
  color:#94a3b8;
  font-size:13px;
  font-weight:800;
}

.user_card{
  display:grid;
  grid-template-columns:64px 1fr;
  gap:14px;
  align-items:center;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:20px;
  padding:12px;
  margin:14px 0 18px;
}

.user_photo{
  width:64px;
  height:64px;
  border-radius:18px;
  background:linear-gradient(135deg,#2563eb,#10b981);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
  overflow:hidden;
}

.user_photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.user_name{
  font-size:20px;
  font-weight:900;
  color:#0f172a;
  line-height:1.15;
}

.user_meta{
  margin-top:4px;
  color:#64748b;
  font-size:14px;
  font-weight:900;
  line-height:1.25;
}

.quick_user{
  border:0;
  width:100%;
  text-align:left;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:20px;
  padding:0;
  margin:14px 0 18px;
  overflow:hidden;
}

.quick_user .user_card{
  margin:0;
  border:0;
  background:transparent;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

@media(max-width:430px){
  body{
    padding:18px;
    align-items:flex-start;
    padding-top:48px;
  }

  .logo{
    width:82px;
    height:82px;
    font-size:48px;
    border-radius:24px;
  }

  .brand h1{
    font-size:34px;
  }

  .box{
    padding:22px;
    border-radius:26px;
  }

  .box h2{
    font-size:30px;
  }
}
</style>
</head>

<body>

<div class="login_wrap">
  <div class="brand">
    <div class="logo">Z</div>
    <h1>Zentryx PRO</h1>
    <p>Acceso seguro de empresa</p>
  </div>

  <div class="box" id="app"></div>

  <div class="footer">
    Zentryx PRO · V3093
  </div>
</div>

<script>
const ZX_VERSION="3093";
const ZX_APP_VERSION="3093";
const ZX_LAST_USER_KEY="zentryx_last_user";

window.sb=supabase.createClient(
  "https://idtaamivqbiuxtjywuux.supabase.co",
  "sb_publishable_ToDLKonbF2QnTXi56o1nfQ_10IdaPJx"
);

window.supabaseClient=window.sb;
</script>

<script src="src/app.js?v=3014"></script>
<script src="src/core/session.js?v=3014"></script>

<script>
let usuarioActual=null;
let bloqueoTimer=null;
const app=document.getElementById("app");

function cliente(){
  return window.sb || window.supabaseClient || null;
}

function limpiar(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function mostrarMsg(txt,tipo){
  const e=document.getElementById("msg");
  if(!e){
    alert(txt);
    return;
  }

  e.textContent=txt;
  e.style.display="block";
  e.classList.remove("ok","info");

  if(tipo==="ok") e.classList.add("ok");
  if(tipo==="info") e.classList.add("info");
}

function limpiarMsg(){
  const e=document.getElementById("msg");
  if(e){
    e.textContent="";
    e.style.display="none";
    e.classList.remove("ok","info");
  }
}

function pararBloqueoTimer(){
  if(bloqueoTimer){
    clearInterval(bloqueoTimer);
    bloqueoTimer=null;
  }
}

function irApp(){
  location.href="app.html?v="+ZX_APP_VERSION;
}

function guardarSesion(){
  if(typeof ZENTRYX_createSession==="function"){
    ZENTRYX_createSession(usuarioActual);
  }else{
    localStorage.setItem("zentryx_session",JSON.stringify({
      id:usuarioActual.id,
      usuario:usuarioActual.usuario,
      nombre:usuarioActual.nombre || usuarioActual.usuario,
      rol:usuarioActual.rol || "Usuario"
    }));

    localStorage.setItem("usuario",JSON.stringify(usuarioActual));
  }

  guardarUltimoUsuario(usuarioActual);
}

function guardarUltimoUsuario(u){
  try{
    localStorage.setItem(ZX_LAST_USER_KEY,JSON.stringify({
      id:u.id,
      usuario:u.usuario,
      nombre:u.nombre || u.usuario,
      rol:u.rol || "Usuario",
      foto_url:u.foto_url || ""
    }));
  }catch(e){}
}

function leerUltimoUsuario(){
  try{
    const raw=localStorage.getItem(ZX_LAST_USER_KEY);
    if(!raw) return null;

    const u=JSON.parse(raw);
    if(u && u.usuario) return u;
  }catch(e){}

  return null;
}

function inicialUsuario(u){
  return limpiar((u.nombre || u.usuario || "?").charAt(0).toUpperCase());
}

function renderFotoUsuario(u){
  if(u && u.foto_url){
    return `<div class="user_photo"><img src="${limpiar(u.foto_url)}" alt="Foto"></div>`;
  }

  return `<div class="user_photo">${inicialUsuario(u || {})}</div>`;
}

function renderTarjetaUsuario(u){
  return `
    <div class="user_card">
      ${renderFotoUsuario(u)}
      <div>
        <div class="user_name">${limpiar(u.nombre || u.usuario || "Usuario")}</div>
        <div class="user_meta">${limpiar(u.rol || "Usuario")}<br>${limpiar(u.usuario || "")}</div>
      </div>
    </div>
  `;
}

function pantallaLogin(){
  pararBloqueoTimer();
  usuarioActual=null;

  const ultimo=leerUltimoUsuario();

  if(ultimo){
    app.innerHTML=`
      <h2>Entrar</h2>
      <div class="sub">Último usuario utilizado.</div>

      <button class="quick_user" id="btn_ultimo_usuario" type="button">
        ${renderTarjetaUsuario(ultimo)}
      </button>

      <button class="btn" id="btn_continuar_ultimo">Continuar</button>
      <button class="btn btn_sec" id="btn_otro_usuario">Cambiar usuario</button>

      <div id="msg" class="msg"></div>
    `;

    document.getElementById("btn_ultimo_usuario").onclick=function(){loginConUsuario(ultimo.usuario)};
    document.getElementById("btn_continuar_ultimo").onclick=function(){loginConUsuario(ultimo.usuario)};
    document.getElementById("btn_otro_usuario").onclick=pantallaEscribirUsuario;
    return;
  }

  pantallaEscribirUsuario();
}

function pantallaEscribirUsuario(){
  pararBloqueoTimer();
  usuarioActual=null;

  app.innerHTML=`
    <h2>Entrar</h2>
    <div class="sub">Introduce tu usuario para continuar.</div>

    <label>Usuario</label>
    <input id="usuario" placeholder="Usuario" autocomplete="username" autocapitalize="none">

    <button class="btn" id="btn_login">Continuar</button>

    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_login").onclick=login;

  document.getElementById("usuario").addEventListener("keydown",function(e){
    if(e.key==="Enter") login();
  });

  setTimeout(function(){
    const input=document.getElementById("usuario");
    if(input) input.focus();
  },250);
}

async function login(){
  const input=document.getElementById("usuario");
  const user=input ? input.value.trim() : "";
  await loginConUsuario(user);
}

async function loginConUsuario(user){
  limpiarMsg();

  const sb=cliente();

  if(!sb){
    mostrarMsg("Supabase no está conectado.");
    return;
  }

  if(!user){
    mostrarMsg("Introduce usuario.");
    return;
  }

  const res=await sb
    .from("usuarios")
    .select("*")
    .eq("usuario",user)
    .maybeSingle();

  if(res.error){
    mostrarMsg("Error Supabase: "+res.error.message);
    return;
  }

  if(!res.data){
    mostrarMsg("Usuario no encontrado.");
    return;
  }

  usuarioActual=res.data;

  if(usuarioActual.activo===false){
    mostrarMsg("Usuario desactivado.");
    return;
  }

  if(usuarioActual.pin_bloqueado_hasta){
    const ahora=new Date();
    const bloqueo=new Date(usuarioActual.pin_bloqueado_hasta);

    if(bloqueo>ahora){
      pantallaPIN();
      iniciarContadorBloqueo(bloqueo);
      return;
    }
  }

  if(usuarioActual.debe_crear_pin || !usuarioActual.pin_hash){
    pantallaCrearPIN();
  }else{
    pantallaPIN();
  }
}

function pantallaCrearPIN(){
  pararBloqueoTimer();

  app.innerHTML=`
    <h2>Crear PIN</h2>
    <div class="sub">Crea un PIN de 4 números para entrar más rápido.</div>

    ${renderTarjetaUsuario(usuarioActual)}

    <label>PIN</label>
    <input id="pin1" class="pin" inputmode="numeric" maxlength="4" placeholder="----">

    <label>Repetir PIN</label>
    <input id="pin2" class="pin" inputmode="numeric" maxlength="4" placeholder="----">

    <button class="btn" id="btn_guardar_pin">Guardar PIN</button>
    <button class="btn btn_sec" id="btn_volver">Cambiar usuario</button>

    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_guardar_pin").onclick=guardarPIN;
  document.getElementById("btn_volver").onclick=function(){
    localStorage.removeItem(ZX_LAST_USER_KEY);
    pantallaEscribirUsuario();
  };

  document.getElementById("pin1").addEventListener("input",function(){
    this.value=this.value.replace(/\D/g,"").slice(0,4);
    if(this.value.length===4){
      document.getElementById("pin2").focus();
    }
  });

  document.getElementById("pin2").addEventListener("input",function(){
    this.value=this.value.replace(/\D/g,"").slice(0,4);
  });

  document.getElementById("pin2").addEventListener("keydown",function(e){
    if(e.key==="Enter") guardarPIN();
  });

  setTimeout(function(){
    const pin=document.getElementById("pin1");
    if(pin) pin.focus();
  },250);
}

async function guardarPIN(){
  limpiarMsg();

  const sb=cliente();

  const p1=document.getElementById("pin1").value.trim();
  const p2=document.getElementById("pin2").value.trim();

  if(!/^[0-9]{4}$/.test(p1) || !/^[0-9]{4}$/.test(p2)){
    mostrarMsg("El PIN debe tener 4 números.");
    return;
  }

  if(p1!==p2){
    mostrarMsg("Los PIN no coinciden.");
    return;
  }

  const hash=btoa(p1);

  const res=await sb
    .from("usuarios")
    .update({
      pin_hash:hash,
      debe_crear_pin:false,
      pin_intentos:0,
      pin_bloqueado_hasta:null,
      ultimo_login:new Date().toISOString()
    })
    .eq("id",usuarioActual.id);

  if(res.error){
    mostrarMsg("Error guardando PIN: "+res.error.message);
    return;
  }

  usuarioActual.pin_hash=hash;
  usuarioActual.debe_crear_pin=false;
  usuarioActual.pin_intentos=0;
  usuarioActual.pin_bloqueado_hasta=null;

  guardarSesion();
  mostrarMsg("PIN creado correctamente.","ok");

  setTimeout(irApp,500);
}

function pantallaPIN(){
  pararBloqueoTimer();

  app.innerHTML=`
    <h2>Acceso</h2>

    ${renderTarjetaUsuario(usuarioActual)}

    <label>Introduce PIN</label>
    <input id="pin" class="pin" inputmode="numeric" maxlength="4" placeholder="----">

    <button class="btn" id="btn_pin">Entrar</button>
    <button class="btn btn_sec" id="btn_volver">Cambiar usuario</button>

    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_pin").onclick=entrar;
  document.getElementById("btn_volver").onclick=function(){
    localStorage.removeItem(ZX_LAST_USER_KEY);
    pantallaEscribirUsuario();
  };

  document.getElementById("pin").addEventListener("input",function(){
    this.value=this.value.replace(/\D/g,"").slice(0,4);
  });

  document.getElementById("pin").addEventListener("keydown",function(e){
    if(e.key==="Enter") entrar();
  });

  setTimeout(function(){
    const pin=document.getElementById("pin");
    if(pin) pin.focus();
  },250);
}

function bloquearFormularioPIN(bloqueado){
  const pin=document.getElementById("pin");
  const btn=document.getElementById("btn_pin");

  if(pin) pin.disabled=!!bloqueado;
  if(btn) btn.disabled=!!bloqueado;
}

function formatoTiempo(ms){
  const total=Math.max(0,Math.ceil(ms/1000));
  const m=Math.floor(total/60);
  const s=total%60;

  if(m<=0) return s+" s";
  return m+" min "+String(s).padStart(2,"0")+" s";
}

function iniciarContadorBloqueo(fechaBloqueo){
  pararBloqueoTimer();
  bloquearFormularioPIN(true);

  function pintar(){
    const restante=fechaBloqueo.getTime()-Date.now();

    if(restante<=0){
      pararBloqueoTimer();
      bloquearFormularioPIN(false);
      mostrarMsg("Ya puedes volver a intentarlo.","ok");
      return;
    }

    mostrarMsg("PIN bloqueado. Inténtalo de nuevo en "+formatoTiempo(restante)+".");
  }

  pintar();
  bloqueoTimer=setInterval(pintar,1000);
}

async function entrar(){
  limpiarMsg();

  const sb=cliente();
  const pinInput=document.getElementById("pin");
  const pin=pinInput ? pinInput.value.trim() : "";

  if(usuarioActual && usuarioActual.pin_bloqueado_hasta){
    const bloqueo=new Date(usuarioActual.pin_bloqueado_hasta);
    if(bloqueo>Date.now()){
      iniciarContadorBloqueo(bloqueo);
      return;
    }
  }

  if(!/^[0-9]{4}$/.test(pin)){
    mostrarMsg("PIN inválido.");
    return;
  }

  const hash=btoa(pin);

  if(hash===usuarioActual.pin_hash){
    const res=await sb
      .from("usuarios")
      .update({
        pin_intentos:0,
        pin_bloqueado_hasta:null,
        ultimo_login:new Date().toISOString()
      })
      .eq("id",usuarioActual.id);

    if(res.error){
      mostrarMsg("Error actualizando login: "+res.error.message);
      return;
    }

    usuarioActual.pin_intentos=0;
    usuarioActual.pin_bloqueado_hasta=null;

    guardarSesion();
    mostrarMsg("Acceso correcto.","ok");

    setTimeout(irApp,350);
    return;
  }

  const intentos=(usuarioActual.pin_intentos || 0)+1;
  let bloqueo=null;

  if(intentos>=3){
    const fecha=new Date();
    fecha.setMinutes(fecha.getMinutes()+5);
    bloqueo=fecha.toISOString();
  }

  const res=await sb
    .from("usuarios")
    .update({
      pin_intentos:intentos,
      pin_bloqueado_hasta:bloqueo,
      ultimo_pin_error:new Date().toISOString()
    })
    .eq("id",usuarioActual.id);

  if(res.error){
    mostrarMsg("Error registrando intento.");
    return;
  }

  usuarioActual.pin_intentos=intentos;
  usuarioActual.pin_bloqueado_hasta=bloqueo;

  if(bloqueo){
    iniciarContadorBloqueo(new Date(bloqueo));
  }else{
    mostrarMsg("PIN incorrecto ("+intentos+"/3).");
  }

  const p=document.getElementById("pin");
  if(p){
    p.value="";
    if(!bloqueo) p.focus();
  }
}

(function iniciar(){
  const s=localStorage.getItem("zentryx_session");

  if(s){
    try{
      const ses=JSON.parse(s);
      if(ses && ses.id && ses.usuario){
        location.href="app.html?v="+ZX_APP_VERSION;
        return;
      }
    }catch(e){}
  }

  pantallaLogin();
})();
</script>

</body>
</html>
