<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Zentryx PRO Login V3014</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#0f172a;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:#1e293b;
  padding:28px;
  border-radius:22px;
}

h2{
  margin:0 0 22px;
  font-size:34px;
  font-weight:900;
}

input{
  width:100%;
  padding:18px;
  margin-bottom:16px;
  border-radius:16px;
  border:0;
  font-size:22px;
}

button{
  width:100%;
  padding:18px;
  border:0;
  border-radius:18px;
  font-size:22px;
  background:#3b82f6;
  color:white;
  font-weight:900;
}

.pin{
  text-align:center;
  font-size:34px;
  letter-spacing:12px;
}

.msg{
  margin-top:16px;
  color:#fecaca;
  font-size:17px;
  font-weight:800;
}
</style>
</head>

<body>

<div class="box" id="app"></div>

<script src="src/app.js?v=3014"></script>
<script src="src/core/session.js?v=3014"></script>

<script>
let usuarioActual=null;
const app=document.getElementById("app");

function cliente(){
  return window.sb || window.supabaseClient || null;
}

function error(txt){
  const e=document.getElementById("msg");
  if(e) e.textContent=txt;
  else alert(txt);
}

function pantallaLogin(){
  app.innerHTML=`
    <h2>Acceso</h2>
    <input id="usuario" placeholder="Usuario" autocomplete="username">
    <button id="btn_login">Entrar</button>
    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_login").onclick=login;
}

async function login(){
  const sb=cliente();

  if(!sb){
    error("Supabase no está conectado.");
    return;
  }

  const user=document.getElementById("usuario").value.trim();

  if(!user){
    error("Introduce usuario.");
    return;
  }

  const res=await sb
    .from("usuarios")
    .select("*")
    .eq("usuario",user)
    .maybeSingle();

  if(res.error){
    error("Error Supabase: " + res.error.message);
    return;
  }

  if(!res.data){
    error("Usuario no encontrado.");
    return;
  }

  usuarioActual=res.data;

  if(usuarioActual.pin_bloqueado_hasta){
    const ahora=new Date();
    const bloqueo=new Date(usuarioActual.pin_bloqueado_hasta);

    if(bloqueo>ahora){
      const min=Math.ceil((bloqueo-ahora)/60000);
      error("PIN bloqueado. Espera " + min + " min.");
      return;
    }
  }

  if(usuarioActual.debe_crear_pin || !usuarioActual.pin_hash){
    pantallaCrearPIN();
  }else{
    pantallaPIN();
  }
}

function pantallaCrearPIN(){
  app.innerHTML=`
    <h2>Crear PIN</h2>
    <input id="pin1" class="pin" inputmode="numeric" maxlength="4" placeholder="----">
    <input id="pin2" class="pin" inputmode="numeric" maxlength="4" placeholder="----">
    <button id="btn_guardar_pin">Guardar PIN</button>
    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_guardar_pin").onclick=guardarPIN;
}

async function guardarPIN(){
  const sb=cliente();

  const p1=document.getElementById("pin1").value.trim();
  const p2=document.getElementById("pin2").value.trim();

  if(!/^[0-9]{4}$/.test(p1) || !/^[0-9]{4}$/.test(p2)){
    error("El PIN debe tener 4 números.");
    return;
  }

  if(p1!==p2){
    error("Los PIN no coinciden.");
    return;
  }

  const hash=btoa(p1);

  const res=await sb
    .from("usuarios")
    .update({
      pin_hash:hash,
      debe_crear_pin:false,
      pin_intentos:0,
      pin_bloqueado_hasta:null,
      ultimo_login:new Date().toISOString()
    })
    .eq("id",usuarioActual.id);

  if(res.error){
    error("Error guardando PIN: " + res.error.message);
    return;
  }

  usuarioActual.pin_hash=hash;
  usuarioActual.debe_crear_pin=false;
  usuarioActual.pin_intentos=0;
  usuarioActual.pin_bloqueado_hasta=null;

  guardarSesion();
  location.href="app.html?v=3014";
}

function pantallaPIN(){
  app.innerHTML=`
    <h2>PIN</h2>
    <input id="pin" class="pin" inputmode="numeric" maxlength="4" placeholder="----">
    <button id="btn_pin">Entrar</button>
    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_pin").onclick=entrar;
}

async function entrar(){
  const sb=cliente();

  const pin=document.getElementById("pin").value.trim();

  if(!/^[0-9]{4}$/.test(pin)){
    error("PIN inválido.");
    return;
  }

  const hash=btoa(pin);

  if(hash===usuarioActual.pin_hash){
    const res=await sb
      .from("usuarios")
      .update({
        pin_intentos:0,
        pin_bloqueado_hasta:null,
        ultimo_login:new Date().toISOString()
      })
      .eq("id",usuarioActual.id);

    if(res.error){
      error("Error actualizando login: " + res.error.message);
      return;
    }

    guardarSesion();
    location.href="app.html?v=3014";
    return;
  }

  const intentos=(usuarioActual.pin_intentos || 0)+1;
  let bloqueo=null;

  if(intentos>=3){
    const fecha=new Date();
    fecha.setMinutes(fecha.getMinutes()+5);
    bloqueo=fecha.toISOString();
  }

  const res=await sb
    .from("usuarios")
    .update({
      pin_intentos:intentos,
      pin_bloqueado_hasta:bloqueo,
      ultimo_pin_error:new Date().toISOString()
    })
    .eq("id",usuarioActual.id);

  if(res.error){
    error("Error registrando intento.");
    return;
  }

  usuarioActual.pin_intentos=intentos;
  usuarioActual.pin_bloqueado_hasta=bloqueo;

  if(bloqueo){
    error("PIN bloqueado 5 min.");
  }else{
    error("PIN incorrecto ("+intentos+"/3).");
  }
}

function guardarSesion(){
  ZENTRYX_createSession(usuarioActual);
}

pantallaLogin();
</script>

</body>
</html>
