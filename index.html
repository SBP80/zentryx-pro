<style>

  display:inline-block;
  width:17px;
  height:17px;
  border:3px solid rgba(255,255,255,.45);

  animation:zx_spin .75s linear infinite;
  vertical-align:-3px;
  margin-right:8px;
}

@keyframes zx_spin{
  to{transform:rotate(360deg)}
}

@media(max-width:430px){

<body>

<div class="login_wrap">
  <div class="brand">
    <div class="logo">Z</div>
    <h1>Zentryx PRO</h1>
    <p>Acceso seguro de empresa</p>
  </div>

  <div class="box" id="app"></div>

  <div class="footer">
    Zentryx PRO · V3092
  </div>
</div>

<script>
const ZX_VERSION="3092";
const ZX_LOGIN_LAST_USER_KEY="zentryx_login_last_user";

window.sb=supabase.createClient(
  "https://idtaamivqbiuxtjywuux.supabase.co",
  "sb_publishable_ToDLKonbF2QnTXi56o1nfQ_10IdaPJx"
);

window.supabaseClient=window.sb;
</script>

<script src="src/app.js?v=3014"></script>
<script src="src/core/session.js?v=3014"></script>

<script>
let usuarioActual=null;
let loginProcesando=false;
const app=document.getElementById("app");

function cliente(){
  return window.sb || window.supabaseClient || null;
}

function limpiar(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function inicialUsuario(u){
  return String((u && (u.nombre || u.usuario)) || "?").trim().charAt(0).toUpperCase() || "?";
}

function nombreUsuario(u){
  return String((u && (u.nombre || u.usuario)) || "Usuario");
}

function rolUsuario(u){
  return String((u && u.rol) || "Usuario");
}

function avatarUsuario(u){
  if(u && u.foto_url){
    return `<div class="user_avatar"><img src="${limpiar(u.foto_url)}" alt="Foto"></div>`;
  }

  return `<div class="user_avatar">${limpiar(inicialUsuario(u))}</div>`;
}

function tarjetaUsuario(u){
  return `
    <div class="user_card">
      ${avatarUsuario(u)}
      <div>
        <div class="user_name">${limpiar(nombreUsuario(u))}</div>
        <div class="user_meta">${limpiar(rolUsuario(u))}<br>${limpiar(u.usuario || "")}</div>
      </div>
    </div>
  `;
}

function mostrarMsg(txt,tipo){
  const e=document.getElementById("msg");
  if(!e){
    alert(txt);
    return;
  }

  e.textContent=txt;
  e.style.display="block";

  if(tipo==="ok"){
    e.classList.add("ok");
  }else{
    e.classList.remove("ok");
  }
}

function limpiarMsg(){
  const e=document.getElementById("msg");
  if(e){
    e.textContent="";
    e.style.display="none";
    e.classList.remove("ok");
  }
}

function ponerBotonCargando(id,activo,texto){
  const b=document.getElementById(id);
  loginProcesando=!!activo;

  if(!b) return;

  if(activo){
    b.dataset.textoOriginal=b.innerHTML;
    b.disabled=true;
    b.innerHTML=`<span class="loader"></span>${limpiar(texto || "Comprobando...")}`;
  }else{
    b.disabled=false;
    if(b.dataset.textoOriginal){
      b.innerHTML=b.dataset.textoOriginal;
    }
  }
}

function irApp(){
  location.href="app.html?v="+ZX_VERSION;
}

function guardarUltimoUsuario(){
  if(!usuarioActual) return;

  try{
    localStorage.setItem(ZX_LOGIN_LAST_USER_KEY,JSON.stringify({
      id:usuarioActual.id || "",
      usuario:usuarioActual.usuario || "",
      nombre:usuarioActual.nombre || usuarioActual.usuario || "",
      rol:usuarioActual.rol || "Usuario",
      foto_url:usuarioActual.foto_url || ""
    }));
  }catch(e){}
}

function leerUltimoUsuario(){
  try{
    const raw=localStorage.getItem(ZX_LOGIN_LAST_USER_KEY);
    if(!raw) return null;
    const u=JSON.parse(raw);
    if(!u || !u.usuario) return null;
    return u;
  }catch(e){
    return null;
  }
}

function borrarUltimoUsuario(){
  try{
    localStorage.removeItem(ZX_LOGIN_LAST_USER_KEY);
  }catch(e){}
}

function guardarSesion(){
  guardarUltimoUsuario();

  if(typeof ZENTRYX_createSession==="function"){
    ZENTRYX_createSession(usuarioActual);
    return;
  }

  localStorage.setItem("zentryx_session",JSON.stringify({
    id:usuarioActual.id,
    usuario:usuarioActual.usuario,
    nombre:usuarioActual.nombre || usuarioActual.usuario,
    rol:usuarioActual.rol || "Usuario"
  }));

  localStorage.setItem("usuario",JSON.stringify(usuarioActual));
}

function pantallaLogin(){
  usuarioActual=null;
  const ultimo=leerUltimoUsuario();

  if(ultimo){
    app.innerHTML=`
      <h2>Entrar</h2>
      <div class="sub">
        Último usuario utilizado.
      </div>

      ${tarjetaUsuario(ultimo)}

      <button class="btn" id="btn_ultimo_usuario">
        Continuar
      </button>

      <button class="btn btn_sec" id="btn_otro_usuario">
        Cambiar usuario
      </button>

      <div id="msg" class="msg"></div>
    `;

    document.getElementById("btn_ultimo_usuario").onclick=function(){
      cargarUsuarioPorNombre(ultimo.usuario,"btn_ultimo_usuario");
    };

    document.getElementById("btn_otro_usuario").onclick=function(){
      borrarUltimoUsuario();
      pantallaLoginManual();
    };

    return;
  }

  pantallaLoginManual();
}

function pantallaLoginManual(){
  usuarioActual=null;

  app.innerHTML=`
    <h2>Entrar</h2>
    <div class="sub">
      Introduce tu usuario para continuar.
    </div>

    <label>Usuario</label>
    <input id="usuario" placeholder="Usuario" autocomplete="username" autocapitalize="none">

    <button class="btn" id="btn_login">
      Continuar
    </button>

    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_login").onclick=login;

  document.getElementById("usuario").addEventListener("keydown",function(e){
    if(e.key==="Enter") login();
  });

  setTimeout(function(){
    const input=document.getElementById("usuario");
    if(input) input.focus();
  },250);
}

async function login(){
  const user=document.getElementById("usuario").value.trim();
  await cargarUsuarioPorNombre(user,"btn_login");
}

async function cargarUsuarioPorNombre(user,botonId){
  limpiarMsg();

  if(loginProcesando) return;

  const sb=cliente();

  if(!sb){
    mostrarMsg("Supabase no está conectado.");
    return;
  }

  if(!user){
    mostrarMsg("Introduce usuario.");
    return;
  }

  ponerBotonCargando(botonId || "btn_login",true,"Comprobando...");

  const res=await sb
    .from("usuarios")
    .select("*")
    .eq("usuario",user)
    .maybeSingle();

  ponerBotonCargando(botonId || "btn_login",false);

  if(res.error){
    mostrarMsg("Error Supabase: "+res.error.message);
    return;
  }

  if(!res.data){
    borrarUltimoUsuario();
    mostrarMsg("Usuario no encontrado.");
    return;
  }

  usuarioActual=res.data;

  if(usuarioActual.activo===false){
    mostrarMsg("Usuario desactivado.");
    return;
  }

  if(usuarioActual.pin_bloqueado_hasta){
    const ahora=new Date();
    const bloqueo=new Date(usuarioActual.pin_bloqueado_hasta);

    if(bloqueo>ahora){
      const min=Math.ceil((bloqueo-ahora)/60000);
      mostrarMsg("PIN bloqueado. Espera "+min+" min.");
      return;
    }
  }

  guardarUltimoUsuario();

  if(usuarioActual.debe_crear_pin || !usuarioActual.pin_hash){
    pantallaCrearPIN();
  }else{
    pantallaPIN();
  }
}

function pantallaCrearPIN(){
  app.innerHTML=`
    <h2>Crear PIN</h2>

    ${tarjetaUsuario(usuarioActual)}

    <div class="sub">
      Crea un PIN de 4 números para entrar más rápido.
    </div>

    <label>PIN</label>
    <input id="pin1" class="pin" type="tel" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="----">

    <label>Repetir PIN</label>
    <input id="pin2" class="pin" type="tel" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="----">

    <button class="btn" id="btn_guardar_pin">
      Guardar PIN
    </button>

    <button class="btn btn_sec" id="btn_volver">
      Cambiar usuario
    </button>

    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_guardar_pin").onclick=guardarPIN;

  document.getElementById("btn_volver").onclick=function(){
    borrarUltimoUsuario();
    pantallaLoginManual();
  };

  document.getElementById("pin1").addEventListener("input",function(){
    this.value=this.value.replace(/\D/g,"").slice(0,4);
    if(this.value.length===4){
      document.getElementById("pin2").focus();
    }
  });

  document.getElementById("pin2").addEventListener("input",function(){
    this.value=this.value.replace(/\D/g,"").slice(0,4);
  });

  document.getElementById("pin2").addEventListener("keydown",function(e){
    if(e.key==="Enter") guardarPIN();
  });

  setTimeout(function(){
    const pin=document.getElementById("pin1");
    if(pin) pin.focus();
  },250);
}

async function guardarPIN(){
  limpiarMsg();

  if(loginProcesando) return;

  const sb=cliente();

  const p1=document.getElementById("pin1").value.trim();
  const p2=document.getElementById("pin2").value.trim();

  if(!/^[0-9]{4}$/.test(p1) || !/^[0-9]{4}$/.test(p2)){
    mostrarMsg("El PIN debe tener 4 números.");
    return;
  }

  if(p1!==p2){
    mostrarMsg("Los PIN no coinciden.");
    return;
  }

  ponerBotonCargando("btn_guardar_pin",true,"Guardando...");

  const hash=btoa(p1);

  const res=await sb
    .from("usuarios")
    .update({
      pin_hash:hash,
      debe_crear_pin:false,
      pin_intentos:0,
      pin_bloqueado_hasta:null,
      ultimo_login:new Date().toISOString()
    })
    .eq("id",usuarioActual.id);

  ponerBotonCargando("btn_guardar_pin",false);

  if(res.error){
    mostrarMsg("Error guardando PIN: "+res.error.message);
    return;
  }

  usuarioActual.pin_hash=hash;
  usuarioActual.debe_crear_pin=false;
  usuarioActual.pin_intentos=0;
  usuarioActual.pin_bloqueado_hasta=null;

  guardarSesion();
  mostrarMsg("PIN creado correctamente.","ok");

  setTimeout(irApp,500);
}

function pantallaPIN(){
  guardarUltimoUsuario();

  app.innerHTML=`
    <h2>Acceso</h2>

    ${tarjetaUsuario(usuarioActual)}

    <label>Introduce PIN</label>
    <input id="pin" class="pin" type="tel" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="----">

    <button class="btn" id="btn_pin">
      Entrar
    </button>

    <button class="btn btn_sec" id="btn_volver">
      Cambiar usuario
    </button>

    <div class="login_hint">
      La biometría mediante passkeys queda reservada para la fase comercial.
    </div>

    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_pin").onclick=entrar;

  document.getElementById("btn_volver").onclick=function(){
    borrarUltimoUsuario();
    pantallaLoginManual();
  };

  document.getElementById("pin").addEventListener("input",function(){
    this.value=this.value.replace(/\D/g,"").slice(0,4);
    if(this.value.length===4){
      entrar();
    }
  });

  document.getElementById("pin").addEventListener("keydown",function(e){
    if(e.key==="Enter") entrar();
  });

  setTimeout(function(){
    const pin=document.getElementById("pin");
    if(pin) pin.focus();
  },250);
}

async function entrar(){
  limpiarMsg();

  if(loginProcesando) return;

  const sb=cliente();

  const pin=document.getElementById("pin").value.trim();

  if(!/^[0-9]{4}$/.test(pin)){
    mostrarMsg("PIN inválido.");
    return;
  }

  ponerBotonCargando("btn_pin",true,"Entrando...");

  const hash=btoa(pin);

  if(hash===usuarioActual.pin_hash){
    const res=await sb
      .from("usuarios")
      .update({
        pin_intentos:0,
        pin_bloqueado_hasta:null,
        ultimo_login:new Date().toISOString()
      })
      .eq("id",usuarioActual.id);

    ponerBotonCargando("btn_pin",false);

    if(res.error){
      mostrarMsg("Error actualizando login: "+res.error.message);
      return;
    }

    guardarSesion();
    mostrarMsg("Acceso correcto.","ok");

    setTimeout(irApp,350);
    return;
  }

  const intentos=(usuarioActual.pin_intentos || 0)+1;
  let bloqueo=null;

  if(intentos>=3){
    const fecha=new Date();
    fecha.setMinutes(fecha.getMinutes()+5);
    bloqueo=fecha.toISOString();
  }

  const res=await sb
    .from("usuarios")
    .update({
      pin_intentos:intentos,
      pin_bloqueado_hasta:bloqueo,
      ultimo_pin_error:new Date().toISOString()
    })
    .eq("id",usuarioActual.id);

  ponerBotonCargando("btn_pin",false);

  if(res.error){
    mostrarMsg("Error registrando intento.");
    return;
  }

  usuarioActual.pin_intentos=intentos;
  usuarioActual.pin_bloqueado_hasta=bloqueo;

  if(bloqueo){
    mostrarMsg("PIN bloqueado 5 min.");
  }else{
    mostrarMsg("PIN incorrecto ("+intentos+"/3).");
  }

  const p=document.getElementById("pin");
  if(p){
    p.value="";
    p.focus();
  }
}

(function iniciar(){
  const s=localStorage.getItem("zentryx_session");

  if(s){
    try{
      const ses=JSON.parse(s);
      if(ses && ses.id && ses.usuario){
        location.href="app.html?v="+ZX_VERSION;
        return;
      }
    }catch(e){}
  }

  pantallaLogin();
})();
</script>
