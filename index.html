<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentryx PRO Login V3001</title>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;display:flex;align-items:center;justify-content:center;height:100vh;color:white}
.box{width:90%;max-width:400px;background:#1e293b;padding:25px;border-radius:16px}
h2{margin-bottom:20px}
input{width:100%;padding:14px;margin-bottom:15px;border-radius:10px;border:none;font-size:18px}
button{width:100%;padding:15px;border:none;border-radius:12px;font-size:18px;background:#3b82f6;color:white;font-weight:bold}
.pin{text-align:center;font-size:30px;letter-spacing:10px}
</style>
</head>
<body>

<div class="box" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="src/app.js?v=3001"></script>

<script>
let usuarioActual=null;
const app=document.getElementById("app");

function getClient(){
  return window.sb || window.supabaseClient || null;
}

function pantallaLogin(){
  app.innerHTML=`
    <h2>Acceso</h2>
    <input id="usuario" placeholder="Usuario">
    <button onclick="login()">Entrar</button>
  `;
}

async function login(){
  const cliente=getClient();

  if(!cliente){
    alert("Error conexión Supabase");
    return;
  }

  const user=document.getElementById("usuario").value.trim();

  if(!user){
    alert("Introduce usuario");
    return;
  }

  const {data,error}=await cliente
    .from("usuarios")
    .select("*")
    .eq("usuario",user)
    .maybeSingle();

  if(error || !data){
    alert("Usuario no encontrado");
    return;
  }

  usuarioActual=data;

  if(data.debe_crear_pin || !data.pin_hash){
    pantallaCrearPIN();
  }else{
    pantallaPIN();
  }
}

function pantallaCrearPIN(){
  app.innerHTML=`
    <h2>Crear PIN</h2>
    <input id="pin1" class="pin" maxlength="4" inputmode="numeric" placeholder="----">
    <input id="pin2" class="pin" maxlength="4" inputmode="numeric" placeholder="----">
    <button onclick="guardarPIN()">Guardar PIN</button>
  `;
}

async function guardarPIN(){
  const cliente=getClient();

  const p1=document.getElementById("pin1").value.trim();
  const p2=document.getElementById("pin2").value.trim();

  if(!/^[0-9]{4}$/.test(p1) || !/^[0-9]{4}$/.test(p2)){
    alert("El PIN debe tener 4 números");
    return;
  }

  if(p1!==p2){
    alert("Los PIN no coinciden");
    return;
  }

  const hash=btoa(p1);

  const {error}=await cliente
    .from("usuarios")
    .update({
      pin_hash:hash,
      debe_crear_pin:false
    })
    .eq("id",usuarioActual.id);

  if(error){
    alert("Error guardando PIN");
    return;
  }

  usuarioActual.pin_hash=hash;
  usuarioActual.debe_crear_pin=false;

  guardarSesion();
  location.href="app.html?v=3001";
}

function pantallaPIN(){
  app.innerHTML=`
    <h2>Introduce PIN</h2>
    <input id="pin" class="pin" maxlength="4" inputmode="numeric" placeholder="----">
    <button onclick="entrar()">Entrar</button>
  `;
}

function entrar(){
  const pin=document.getElementById("pin").value.trim();

  if(!/^[0-9]{4}$/.test(pin)){
    alert("PIN inválido");
    return;
  }

  const hash=btoa(pin);

  if(hash!==usuarioActual.pin_hash){
    alert("PIN incorrecto");
    return;
  }

  guardarSesion();
  location.href="app.html?v=3001";
}

function guardarSesion(){
  localStorage.setItem("zentryx_session",JSON.stringify({
    id:usuarioActual.id,
    usuario:usuarioActual.usuario,
    nombre:usuarioActual.nombre,
    rol:usuarioActual.rol
  }));
}

pantallaLogin();
</script>

</body>
</html>
