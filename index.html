<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentryx PRO Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0f172a;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  color:white;
}
.box{
  width:90%;
  max-width:400px;
  background:#1e293b;
  padding:25px;
  border-radius:16px;
}
input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  border:none;
  font-size:18px;
}
button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  font-size:18px;
  background:#3b82f6;
  color:white;
  font-weight:bold;
}
.pin{
  text-align:center;
  font-size:30px;
  letter-spacing:10px;
}
</style>
</head>

<body>

<div class="box" id="app"></div>

<script src="src/app.js?v=3010"></script>

<script>
let usuarioActual=null;

function sb(){
  return window.sb || window.supabaseClient;
}

// =====================
// LOGIN USUARIO
// =====================
function pantallaLogin(){
  app.innerHTML=`
    <h2>Acceso</h2>
    <input id="usuario" placeholder="Usuario">
    <button onclick="login()">Entrar</button>
  `;
}

async function login(){
  const user=document.getElementById("usuario").value;

  const {data,error}=await sb()
    .from("usuarios")
    .select("*")
    .eq("usuario",user)
    .single();

  if(error || !data){
    alert("Usuario no encontrado");
    return;
  }

  usuarioActual=data;

  // comprobar bloqueo
  if(data.pin_bloqueado_hasta){
    const ahora=new Date();
    const bloqueo=new Date(data.pin_bloqueado_hasta);

    if(bloqueo>ahora){
      const minutos=Math.ceil((bloqueo-ahora)/60000);
      alert("Bloqueado " + minutos + " min");
      return;
    }
  }

  if(data.debe_crear_pin || !data.pin_hash){
    pantallaCrearPIN();
  }else{
    pantallaPIN();
  }
}

// =====================
// CREAR PIN
// =====================
function pantallaCrearPIN(){
  app.innerHTML=`
    <h2>Crear PIN</h2>
    <input id="pin1" class="pin" maxlength="4">
    <input id="pin2" class="pin" maxlength="4">
    <button onclick="guardarPIN()">Guardar</button>
  `;
}

async function guardarPIN(){
  const p1=document.getElementById("pin1").value;
  const p2=document.getElementById("pin2").value;

  if(p1!==p2){
    alert("No coincide");
    return;
  }

  const hash=btoa(p1);

  await sb().from("usuarios").update({
    pin_hash:hash,
    debe_crear_pin:false,
    pin_intentos:0,
    pin_bloqueado_hasta:null
  }).eq("id",usuarioActual.id);

  pantallaPIN();
}

// =====================
// LOGIN PIN
// =====================
function pantallaPIN(){
  app.innerHTML=`
    <h2>PIN</h2>
    <input id="pin" class="pin" maxlength="4">
    <button onclick="entrar()">Entrar</button>
  `;
}

async function entrar(){
  const pin=document.getElementById("pin").value;
  const hash=btoa(pin);

  // correcto
  if(hash===usuarioActual.pin_hash){

    await sb().from("usuarios").update({
      pin_intentos:0,
      pin_bloqueado_hasta:null,
      ultimo_login:new Date().toISOString()
    }).eq("id",usuarioActual.id);

    localStorage.setItem("zentryx_session",JSON.stringify(usuarioActual));
    location.href="app.html?v=3010";
    return;
  }

  // incorrecto
  let intentos=(usuarioActual.pin_intentos || 0) + 1;

  let bloqueo=null;

  if(intentos>=3){
    const fecha=new Date();
    fecha.setMinutes(fecha.getMinutes()+5);
    bloqueo=fecha.toISOString();
    alert("Bloqueado 5 min");
  }else{
    alert("PIN incorrecto ("+intentos+"/3)");
  }

  await sb().from("usuarios").update({
    pin_intentos:intentos,
    pin_bloqueado_hasta:bloqueo,
    ultimo_pin_error:new Date().toISOString()
  }).eq("id",usuarioActual.id);

  usuarioActual.pin_intentos=intentos;
  usuarioActual.pin_bloqueado_hasta=bloqueo;
}

const app=document.getElementById("app");
pantallaLogin();
</script>

</body>
</html>
