<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zentryx PRO - Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
  background:#071330;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

.box{
  width:100%;
  max-width:420px;
  padding:30px;
}

.logo{
  font-size:42px;
  font-weight:900;
  margin-bottom:20px;
}

input{
  width:100%;
  height:48px;
  margin-bottom:12px;
  padding:0 12px;
  border-radius:10px;
  border:0;
  font-size:16px;
}

button{
  width:100%;
  height:48px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:18px;
  font-weight:900;
}

.error{
  margin-top:10px;
  color:#fca5a5;
}
</style>
</head>

<body>

<div class="box">
  <div class="logo">Zentryx</div>

  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Contraseña">

  <button onclick="login()">Entrar</button>

  <div id="error" class="error"></div>
</div>

<script>
function getUsers(){
  try{
    const state=JSON.parse(localStorage.getItem("zentryx_state"));
    return state?.usuarios || [];
  }catch{
    return [];
  }
}

function login(){

  const u=document.getElementById("user").value.trim();
  const p=document.getElementById("pass").value.trim();

  if(!u || !p){
    document.getElementById("error").textContent="Completa los campos";
    return;
  }

  const users=getUsers();

  const user=users.find(x=>x.usuario===u && x.password===p);

  if(!user){
    document.getElementById("error").textContent="Usuario o contraseña incorrectos";
    return;
  }

  localStorage.setItem("zentryx_session",JSON.stringify({
    usuario:user.usuario,
    nombre:user.nombre,
    rol:user.rol,
    login_at:new Date().toISOString()
  }));

  window.location.href="app.html";
}
</script>

</body>
</html>
