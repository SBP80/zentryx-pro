<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentryx PRO Login</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0f172a;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  color:white;
}

.box{
  width:90%;
  max-width:400px;
  background:#1e293b;
  padding:25px;
  border-radius:16px;
}

h2{margin-bottom:20px}

input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  border:none;
  font-size:18px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  font-size:18px;
  background:#3b82f6;
  color:white;
  font-weight:bold;
}

.pin{
  text-align:center;
  font-size:30px;
  letter-spacing:10px;
}
</style>
</head>

<body>

<div class="box" id="app"></div>

<!-- 1. Cargar Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Tu core (aquí está la conexión) -->
<script src="src/app.js?v=2676"></script>

<script>
let usuarioActual=null;

function getClient(){
  return window.sb || window.supabaseClient || null;
}

// ==========================
// LOGIN USUARIO
// ==========================
function pantallaLogin(){
  app.innerHTML=`
    <h2>Acceso</h2>
    <input id="usuario" placeholder="Usuario">
    <button onclick="login()">Entrar</button>
  `;
}

async function login(){
  const sb=getClient();

  if(!sb){
    alert("Error conexión Supabase");
    return;
  }

  const user=document.getElementById("usuario").value;

  const {data,error}=await sb
    .from("usuarios")
    .select("*")
    .eq("usuario",user)
    .single();

  if(error || !data){
    alert("Usuario no encontrado");
    return;
  }

  usuarioActual=data;

  if(data.debe_crear_pin || !data.pin_hash){
    pantallaCrearPIN();
  }else{
    pantallaPIN();
  }
}

// ==========================
// CREAR PIN
// ==========================
function pantallaCrearPIN(){
  app.innerHTML=`
    <h2>Crear PIN</h2>
    <input id="pin1" class="pin" maxlength="4" placeholder="----">
    <input id="pin2" class="pin" maxlength="4" placeholder="Repetir PIN">
    <button onclick="guardarPIN()">Guardar PIN</button>
  `;
}

async function guardarPIN(){
  const sb=getClient();

  const p1=document.getElementById("pin1").value;
  const p2=document.getElementById("pin2").value;

  if(p1.length!==4 || p2.length!==4){
    alert("PIN debe tener 4 dígitos");
    return;
  }

  if(p1!==p2){
    alert("No coinciden");
    return;
  }

  const hash=btoa(p1);

  await sb.from("usuarios").update({
    pin_hash:hash,
    debe_crear_pin:false
  }).eq("id",usuarioActual.id);

  pantallaPIN();
}

// ==========================
// LOGIN CON PIN
// ==========================
function pantallaPIN(){
  app.innerHTML=`
    <h2>Introduce PIN</h2>
    <input id="pin" class="pin" maxlength="4" placeholder="----">
    <button onclick="entrar()">Entrar</button>
  `;
}

function entrar(){
  const pin=document.getElementById("pin").value;
  const hash=btoa(pin);

  if(hash!==usuarioActual.pin_hash){
    alert("PIN incorrecto");
    return;
  }

  localStorage.setItem("zentryx_user",JSON.stringify(usuarioActual));
  location.href="app.html?v=2676";
}

// ==========================
const app=document.getElementById("app");
pantallaLogin();
</script>

</body>
</html>
