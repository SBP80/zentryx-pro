<script>
let usuarioActual=null;
let bloqueoTimer=null;
const app=document.getElementById("app");

function cliente(){return window.sb || window.supabaseClient || null}
function limpiar(v){return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function normalizar(v){return String(v ?? "").trim().toLowerCase()}

function esUsuarioDesarrollador(v){
  const u=normalizar(v);
  return u==="desarrollador" || u==="developer" || u==="dev";
}


function cuentaDesarrollador(){
  return {
    id:"zentryx_developer",
    usuario:"desarrollador",
    nombre:"Desarrollador",
    rol:"Desarrollador",
    empresa_id:"global",
    tecnico:true,
    desarrollador:true,
    activo:true,
    foto_url:""
  };
}

function guardarSesionDesarrollador(){
  const u=cuentaDesarrollador();
  const ahora=new Date().toISOString();

  if(typeof window.ZENTRYX_createSession==="function"){
    window.ZENTRYX_createSession(u);
  }else{
    localStorage.setItem("zentryx_session",JSON.stringify({
      id:u.id,
      usuario:u.usuario,
      nombre:u.nombre,
      rol:u.rol,
      empresa_id:u.empresa_id,
      tecnico:true,
      desarrollador:true,
      inicio:ahora,
      actividad:ahora
    }));
    localStorage.setItem("usuario",JSON.stringify(u));
  }

  localStorage.setItem(ZX_DEV_LAST_KEY,ahora);
  localStorage.setItem(ZX_LOGIN_LAST_USER,JSON.stringify({
    id:u.id,
    usuario:u.usuario,
    nombre:u.nombre,
    rol:u.rol,
    foto_url:"",
    tecnico:true,
    guardado_en:ahora
  }));
}

function crearIdDispositivo(){
  if(window.crypto && typeof window.crypto.randomUUID==="function") return window.crypto.randomUUID();
  return "zx_"+Date.now()+"_"+Math.random().toString(16).slice(2);
}

function obtenerIdDispositivo(){
  let id=localStorage.getItem(ZX_DEVICE_KEY);
  if(!id){
    id=crearIdDispositivo();
    localStorage.setItem(ZX_DEVICE_KEY,id);
  }
  return id;
}

function detectarDispositivo(){
  const ua=navigator.userAgent || "";
  const plataforma=navigator.platform || "";
  const maxTouch=Number(navigator.maxTouchPoints || 0);

  const esIPad=/iPad/i.test(ua) || (plataforma==="MacIntel" && maxTouch>1);
  const esIPhone=/iPhone|iPod/i.test(ua);
  const esIOS=esIPad || esIPhone;
  const esAndroid=/Android/i.test(ua);
  const esTabletAndroid=esAndroid && !/Mobile/i.test(ua);
  const esMac=/Mac/i.test(plataforma) && !esIOS;
  const esWindows=/Win/i.test(plataforma);
  const esLinux=/Linux/i.test(plataforma) && !esAndroid;

  let tipo_dispositivo="desktop";
  if(esIPad || esTabletAndroid) tipo_dispositivo="tablet";
  else if(esIPhone || (esAndroid && !esTabletAndroid)) tipo_dispositivo="movil";

  let sistema_operativo="Desconocido";
  if(esIPad) sistema_operativo="iPadOS";
  else if(esIPhone) sistema_operativo="iOS";
  else if(esAndroid) sistema_operativo="Android";
  else if(esMac) sistema_operativo="macOS";
  else if(esWindows) sistema_operativo="Windows";
  else if(esLinux) sistema_operativo="Linux";

  let navegador="Navegador";
  if(/EdgiOS|EdgA|Edg\//i.test(ua)) navegador="Edge";
  else if(/CriOS/i.test(ua)) navegador="Chrome";
  else if(/FxiOS/i.test(ua)) navegador="Firefox";
  else if(/OPiOS|OPR\//i.test(ua)) navegador="Opera";
  else if(/Chrome|Chromium/i.test(ua) && !/Edg|OPR/i.test(ua)) navegador="Chrome";
  else if(/Firefox/i.test(ua)) navegador="Firefox";
  else if(/Safari/i.test(ua)) navegador="Safari";

  let nombreBase="Dispositivo";
  if(esIPad) nombreBase="iPad";
  else if(esIPhone) nombreBase="iPhone";
  else if(esTabletAndroid) nombreBase="Tablet Android";
  else if(esAndroid) nombreBase="Móvil Android";
  else if(esMac) nombreBase="Mac";
  else if(esWindows) nombreBase="PC Windows";
  else if(esLinux) nombreBase="PC Linux";

  return {
    nombre_dispositivo:(nombreBase+" · "+navegador).trim(),
    tipo_dispositivo:tipo_dispositivo,
    sistema_operativo:sistema_operativo,
    navegador:navegador,
    user_agent:ua,
    ultimo_acceso:new Date().toISOString(),
    ultimo_acceso_local:new Intl.DateTimeFormat("es-ES",{
      day:"2-digit",month:"2-digit",year:"numeric",
      hour:"2-digit",minute:"2-digit",second:"2-digit",
      hour12:false
    }).format(new Date())
  };
}

async function registrarDispositivoSeguro(){
  try{
    const sb=cliente();
    if(!sb || !usuarioActual || !usuarioActual.id || usuarioActual.tecnico) return;

    obtenerIdDispositivo();

    const d=detectarDispositivo();
    const ahora=d.ultimo_acceso;

    const existente=await sb
      .from("usuarios_dispositivos")
      .select("id")
      .eq("usuario_id",usuarioActual.id)
      .eq("user_agent",d.user_agent)
      .order("ultimo_acceso",{ascending:false})
      .limit(1)
      .maybeSingle();

    if(existente && !existente.error && existente.data && existente.data.id){
      await sb.from("usuarios_dispositivos").update({
        nombre_dispositivo:d.nombre_dispositivo,
        tipo_dispositivo:d.tipo_dispositivo,
        sistema_operativo:d.sistema_operativo,
        navegador:d.navegador,
        ultimo_acceso:ahora,
        updated_at:ahora
      }).eq("id",existente.data.id);
      return;
    }

    await sb.from("usuarios_dispositivos").insert({
      usuario_id:usuarioActual.id,
      nombre_dispositivo:d.nombre_dispositivo,
      tipo_dispositivo:d.tipo_dispositivo,
      sistema_operativo:d.sistema_operativo,
      navegador:d.navegador,
      user_agent:d.user_agent,
      passkey_activa:false,
      passkey_counter:0,
      autorizado:true,
      revocado:false,
      ultimo_acceso:ahora,
      created_at:ahora,
      updated_at:ahora
    });
  }catch(e){
    console.warn("Registro de dispositivo omitido",e);
  }
}

function mostrarMsg(txt,tipo){
  const e=document.getElementById("msg");
  if(!e){alert(txt);return}
  e.textContent=txt;
  e.style.display="block";
  e.classList.remove("ok","info");
  if(tipo) e.classList.add(tipo);
}

function limpiarMsg(){
  const e=document.getElementById("msg");
  if(e){e.textContent="";e.style.display="none";e.classList.remove("ok","info")}
}

function setLoading(txt){
  app.innerHTML=`<div class="loading"><div class="spinner"></div><div>${limpiar(txt || "Cargando...")}</div></div>`;
}

function irApp(){location.replace("app.html?v="+ZX_APP_VERSION+"&t="+Date.now())}

function guardarSesion(){
  if(typeof ZENTRYX_createSession==="function"){
    ZENTRYX_createSession(usuarioActual);
  }else{
    localStorage.setItem("zentryx_session",JSON.stringify({
      id:usuarioActual.id,
      usuario:usuarioActual.usuario,
      nombre:usuarioActual.nombre || usuarioActual.usuario,
      rol:usuarioActual.rol || "Usuario",
      empresa_id:usuarioActual.empresa_id || "demo",
      permisos:usuarioActual.permisos && typeof usuarioActual.permisos==="object" ? usuarioActual.permisos : {},
      inicio:new Date().toISOString(),
      actividad:new Date().toISOString()
    }));
    const usuarioLocal=typeof window.ZENTRYX_sanitizeLocalUser==="function"
      ? window.ZENTRYX_sanitizeLocalUser(usuarioActual)
      : {
          id:usuarioActual.id,
          usuario:usuarioActual.usuario,
          nombre:usuarioActual.nombre || usuarioActual.usuario,
          rol:usuarioActual.rol || "Usuario",
          empresa_id:usuarioActual.empresa_id || "demo",
          permisos:usuarioActual.permisos && typeof usuarioActual.permisos==="object" ? usuarioActual.permisos : {},
          foto_url:usuarioActual.foto_url || "",
          activo:usuarioActual.activo!==false
        };
    localStorage.setItem("usuario",JSON.stringify(usuarioLocal));
  }

  guardarUltimoUsuario(usuarioActual);
}

function guardarUltimoUsuario(u){
  if(!u || !u.id) return;
  localStorage.setItem(ZX_LOGIN_LAST_USER,JSON.stringify({
    id:u.id,
    usuario:u.usuario || "",
    nombre:u.nombre || u.usuario || "",
    rol:u.rol || "",
    foto_url:u.foto_url || "",
    tecnico:!!u.tecnico,
    guardado_en:new Date().toISOString()
  }));
}

function leerUltimoUsuario(){
  try{return JSON.parse(localStorage.getItem(ZX_LOGIN_LAST_USER) || "null")}
  catch(e){return null}
}

function borrarUltimoUsuario(){localStorage.removeItem(ZX_LOGIN_LAST_USER)}

function leerBloqueosLocales(){
  try{return JSON.parse(localStorage.getItem(ZX_LOGIN_LOCKS) || "{}")}
  catch(e){return {}}
}

function guardarBloqueosLocales(bloqueos){
  localStorage.setItem(ZX_LOGIN_LOCKS,JSON.stringify(bloqueos || {}));
}

function claveUsuario(u){
  return String((u && (u.id || u.usuario)) || "");
}

function guardarBloqueoLocal(u,hasta,ultimoError){
  const k=claveUsuario(u);
  if(!k || !hasta) return;
  const bloqueos=leerBloqueosLocales();
  bloqueos[k]={hasta:String(hasta),ultimo_error:String(ultimoError || new Date().toISOString())};
  guardarBloqueosLocales(bloqueos);
}

function borrarBloqueoLocal(u){
  const k=claveUsuario(u);
  if(!k) return;
  const bloqueos=leerBloqueosLocales();
  delete bloqueos[k];
  guardarBloqueosLocales(bloqueos);
}

function bloqueoLocalActivo(u){
  const k=claveUsuario(u);
  if(!k) return null;

  const bloqueos=leerBloqueosLocales();
  const b=bloqueos[k];

  if(!b || !b.hasta) return null;

  const fecha=new Date(b.hasta);

  if(Number.isNaN(fecha.getTime()) || fecha<=new Date()){
    delete bloqueos[k];
    guardarBloqueosLocales(bloqueos);
    return null;
  }

  return fecha;
}

function avatarHtml(u){
  if(u && u.foto_url){return `<img class="user_avatar" src="${limpiar(u.foto_url)}" alt="Foto">`}
  const letra=String((u && (u.nombre || u.usuario)) || "Z").charAt(0).toUpperCase();
  return `<div class="user_avatar">${limpiar(letra)}</div>`;
}

function tarjetaUsuario(u){
  return `
    <div class="user_card">
      ${avatarHtml(u)}
      <div>
        <div class="user_name">${limpiar(u.nombre || u.usuario || "Usuario")}</div>
        <div class="user_meta">${limpiar(u.rol || "Usuario")}<br>${limpiar(u.usuario || "")}</div>
      </div>
    </div>
  `;
}

function fechaBloqueoSupabaseActiva(u){
  if(!u || !u.pin_bloqueado_hasta) return null;
  const bloqueo=new Date(u.pin_bloqueado_hasta);
  if(Number.isNaN(bloqueo.getTime())) return null;
  if(bloqueo<=new Date()) return null;
  return bloqueo;
}

function fechaBloqueoActiva(u){
  const a=fechaBloqueoSupabaseActiva(u);
  const b=bloqueoLocalActivo(u);
  if(a && b) return a.getTime()>=b.getTime() ? a : b;
  return a || b || null;
}

function segundosRestantes(fecha){return Math.max(0,Math.ceil((fecha.getTime()-Date.now())/1000))}
function textoTiempo(seg){
  const m=Math.floor(seg/60);
  const s=seg%60;
  if(m<=0) return s+" s";
  return m+" min "+String(s).padStart(2,"0")+" s";
}

async function cargarUsuarioPorUsuario(usuario){
  const sb=cliente();
  if(!sb) return {error:{message:"Supabase no está conectado."},data:null};
  return await sb.from("usuarios").select("*").eq("usuario",usuario).maybeSingle();
}

async function cargarUsuarioPorId(id){
  const sb=cliente();
  if(!sb) return {error:{message:"Supabase no está conectado."},data:null};
  return await sb.from("usuarios").select("*").eq("id",id).maybeSingle();
}

async function refrescarUsuarioActual(){
  if(!usuarioActual || usuarioActual.tecnico) return null;

  let res=null;
  if(usuarioActual.id) res=await cargarUsuarioPorId(usuarioActual.id);
  else if(usuarioActual.usuario) res=await cargarUsuarioPorUsuario(usuarioActual.usuario);

  if(res && !res.error && res.data){
    usuarioActual=res.data;
    guardarUltimoUsuario(usuarioActual);
    return usuarioActual;
  }

  return null;
}

async function limpiarBloqueoSiCaducado(u){
  if(!u || !u.id || u.tecnico) return u;

  const bloqueoDB=u.pin_bloqueado_hasta ? new Date(u.pin_bloqueado_hasta) : null;
  const bloqueoLocal=bloqueoLocalActivo(u);

  if(bloqueoLocal) return u;

  if(bloqueoDB && !Number.isNaN(bloqueoDB.getTime()) && bloqueoDB<=new Date()){
    try{
      await cliente().from("usuarios").update({
        pin_intentos:0,
        pin_bloqueado_hasta:null,
        updated_at:new Date().toISOString()
      }).eq("id",u.id);

      u.pin_intentos=0;
      u.pin_bloqueado_hasta=null;
    }catch(e){}
  }

  return u;
}

  app.innerHTML=`

async function guardarPINDesarrollador(){
  limpiarMsg();

  const p1=document.getElementById("pin1").value.trim();
  const p2=document.getElementById("pin2").value.trim();

  if(!/^[0-9]{6,8}$/.test(p1) || !/^[0-9]{6,8}$/.test(p2)){

    return;
  }

  if(p1!==p2){
    mostrarMsg("Los PIN no coinciden.");
    return;
  }

  localStorage.setItem(ZX_DEV_PIN_KEY,await ZENTRYX_SECURITY.hashPin("ZX_DEV::"+p1));
  guardarSesionDesarrollador();
  mostrarMsg("Acceso desarrollador creado.","ok");
  setTimeout(irApp,500);
}

function pantallaPINDesarrollador(){
  clearInterval(bloqueoTimer);
  usuarioActual=cuentaDesarrollador();

  app.innerHTML=`
    <h2>Acceso técnico</h2>
    <div class="sub">Perfil Desarrollador. Diagnóstico, mantenimiento y soporte.</div>
    ${tarjetaUsuario(usuarioActual)}
    <label for="pin">PIN desarrollador</label>

    <button class="btn btn_sec" id="btn_volver_dev">Cambiar usuario</button>

  `;

  document.getElementById("btn_pin_dev").onclick=entrarDesarrollador;

    this.value=this.value.replace(/\D/g,"").slice(0,8);
  });

  document.getElementById("pin").addEventListener("keydown",function(e){

}

async function entrarDesarrollador(){
  limpiarMsg();

  const pin=document.getElementById("pin") ? document.getElementById("pin").value.trim() : "";
  const hash=localStorage.getItem(ZX_DEV_PIN_KEY) || "";

  if(!/^[0-9]{6,8}$/.test(pin)){
    mostrarMsg("Introduce el PIN técnico.");
    return;
  }

  const verificacionDev=await ZENTRYX_SECURITY.verifyPin("ZX_DEV::"+pin,hash);
  if(!verificacionDev.ok){
    mostrarMsg("PIN técnico incorrecto.");
    return;
  }

  if(verificacionDev.needsUpgrade){
    localStorage.setItem(ZX_DEV_PIN_KEY,await ZENTRYX_SECURITY.hashPin("ZX_DEV::"+pin));
  }
  guardarSesionDesarrollador();
  mostrarMsg("Acceso correcto.","ok");
  setTimeout(irApp,350);
}

function abrirAccesoDesarrollador(){
  if(localStorage.getItem(ZX_DEV_PIN_KEY)){
    pantallaPINDesarrollador();
  }else{
    pantallaCrearPINDesarrollador();
  }
}

  clearInterval(bloqueoTimer);
  usuarioActual=null;

  app.innerHTML=`
    <h2>Entrar</h2>
    <div class="sub">Introduce tu usuario para continuar.</div>
    <label for="usuario">Usuario</label>
    <input id="usuario" placeholder="Usuario" autocomplete="username" autocapitalize="none" spellcheck="false">

    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_login").onclick=login;

function pantallaUltimoUsuario(u){
  clearInterval(bloqueoTimer);
  usuarioActual=u;

  app.innerHTML=`
    <h2>Entrar</h2>
    <div class="sub">Último usuario utilizado.</div>
    ${tarjetaUsuario(u)}
    <button class="btn" id="btn_continuar_ultimo">Continuar</button>
    <button class="btn btn_sec" id="btn_cambiar_usuario">Cambiar usuario</button>
    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_continuar_ultimo").onclick=continuarUltimoUsuario;
  document.getElementById("btn_cambiar_usuario").onclick=function(){borrarUltimoUsuario();pantallaLogin()};
}

async function continuarUltimoUsuario(){
  limpiarMsg();
  setLoading("Comprobando acceso...");

  const ultimo=usuarioActual || leerUltimoUsuario();
  if(!ultimo){pantallaLogin();return}

  if(ultimo.tecnico || esUsuarioDesarrollador(ultimo.usuario)){
    usuarioActual=cuentaDesarrollador();
    abrirAccesoDesarrollador();
    return;
  }

  let res=null;
  if(ultimo.id) res=await cargarUsuarioPorId(ultimo.id);
  else res=await cargarUsuarioPorUsuario(ultimo.usuario);

  if(res.error){pantallaUltimoUsuario(ultimo);mostrarMsg("No se pudo conectar. Comprueba la cobertura e inténtalo de nuevo.");return}
  if(!res.data){borrarUltimoUsuario();pantallaLogin();mostrarMsg("Usuario no encontrado.");return}

  usuarioActual=await limpiarBloqueoSiCaducado(res.data);
  guardarUltimoUsuario(usuarioActual);

  if(usuarioActual.activo===false){pantallaLogin();mostrarMsg("Usuario desactivado.");return}

  const bloqueo=fechaBloqueoActiva(usuarioActual);
  if(bloqueo){pantallaBloqueado(usuarioActual,bloqueo);return}

  if(usuarioActual.debe_crear_pin || !usuarioActual.pin_hash) pantallaCrearPIN();
  else pantallaPIN();
}

async function login(){
  limpiarMsg();
  const sb=cliente();
  if(!sb){mostrarMsg("No hay conexión disponible.");return}

  const input=document.getElementById("usuario");
  const user=normalizar(input ? input.value : "");
  if(!user){mostrarMsg("Introduce usuario.");return}

  if(esUsuarioDesarrollador(user)){
    abrirAccesoDesarrollador();
    return;
  }

  setLoading("Comprobando usuario...");
  const res=await cargarUsuarioPorUsuario(user);

  if(res.error){pantallaLogin();document.getElementById("usuario").value=user;mostrarMsg("No se pudo conectar. Comprueba la cobertura e inténtalo de nuevo.");return}
  if(!res.data){pantallaLogin();document.getElementById("usuario").value=user;mostrarMsg("Usuario no encontrado.");return}

  usuarioActual=await limpiarBloqueoSiCaducado(res.data);
  guardarUltimoUsuario(usuarioActual);

  if(usuarioActual.activo===false){pantallaLogin();mostrarMsg("Usuario desactivado.");return}

  const bloqueo=fechaBloqueoActiva(usuarioActual);
  if(bloqueo){pantallaBloqueado(usuarioActual,bloqueo);return}

  if(usuarioActual.debe_crear_pin || !usuarioActual.pin_hash) pantallaCrearPIN();
  else pantallaPIN();
}

function pantallaBloqueado(u,bloqueo){
  clearInterval(bloqueoTimer);
  usuarioActual=u;

  app.innerHTML=`
    <h2>Acceso</h2>
    ${tarjetaUsuario(u)}
    <label>Introduce PIN</label>
    <input class="pin" disabled placeholder="----">
    <button class="btn" disabled>Entrar</button>
    <button class="btn btn_sec" id="btn_bloqueo_cambiar">Cambiar usuario</button>
    <div class="msg" id="msg" style="display:block"></div>
    <div class="progress"><span id="bloqueo_barra"></span></div>
  `;

  document.getElementById("btn_bloqueo_cambiar").onclick=function(){pantallaLogin()};

  const actualizar=function(){
    const s=segundosRestantes(bloqueo);
    const msg=document.getElementById("msg");
    const barra=document.getElementById("bloqueo_barra");

    if(s<=0){
      clearInterval(bloqueoTimer);
      mensajeFinBloqueo();
      return;
    }

    if(msg) msg.textContent="PIN bloqueado. Inténtalo de nuevo en "+textoTiempo(s)+".";
    if(barra){
      const pct=Math.max(0,Math.min(100,Math.round((s/300)*100)));
      barra.style.width=pct+"%";
    }
  };

  actualizar();
  bloqueoTimer=setInterval(actualizar,1000);
}

async function mensajeFinBloqueo(){
  await refrescarUsuarioActual();

  if(usuarioActual){
    borrarBloqueoLocal(usuarioActual);
    usuarioActual.pin_bloqueado_hasta=null;
    usuarioActual.pin_intentos=0;
    pantallaPIN();
    mostrarMsg("Bloqueo finalizado. Puedes intentarlo de nuevo.","info");
  }else{
    pantallaLogin();
  }
}

function pantallaCrearPIN(){
  clearInterval(bloqueoTimer);
  app.innerHTML=`
    <h2>Crear PIN</h2>
    <div class="sub">Crea un PIN de 4 números para entrar más rápido.</div>
    ${tarjetaUsuario(usuarioActual)}
    <label for="pin1">PIN</label>
    <input id="pin1" class="pin" inputmode="numeric" maxlength="4" placeholder="----" autocomplete="new-password">
    <label for="pin2">Repetir PIN</label>
    <input id="pin2" class="pin" inputmode="numeric" maxlength="4" placeholder="----" autocomplete="new-password">
    <button class="btn" id="btn_guardar_pin">Guardar PIN</button>
    <button class="btn btn_sec" id="btn_volver">Cambiar usuario</button>
    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_guardar_pin").onclick=guardarPIN;
  document.getElementById("btn_volver").onclick=pantallaLogin;

  document.getElementById("pin1").addEventListener("input",function(){
    this.value=this.value.replace(/\D/g,"").slice(0,4);
    if(this.value.length===4) document.getElementById("pin2").focus();
  });

  document.getElementById("pin2").addEventListener("input",function(){this.value=this.value.replace(/\D/g,"").slice(0,4)});
  document.getElementById("pin2").addEventListener("keydown",function(e){if(e.key==="Enter") guardarPIN()});
  setTimeout(()=>{const p=document.getElementById("pin1");if(p) p.focus()},250);
}

async function guardarPIN(){
  limpiarMsg();

  const sb=cliente();
  const p1=document.getElementById("pin1").value.trim();
  const p2=document.getElementById("pin2").value.trim();

  if(!/^[0-9]{4}$/.test(p1) || !/^[0-9]{4}$/.test(p2)){mostrarMsg("El PIN debe tener 4 números.");return}
  if(p1!==p2){mostrarMsg("Los PIN no coinciden.");return}

  const hash=await ZENTRYX_SECURITY.hashPin(p1);

  const res=await sb.from("usuarios").update({
    pin_hash:hash,
    debe_crear_pin:false,
    pin_intentos:0,
    pin_bloqueado_hasta:null,
    ultimo_login:new Date().toISOString(),
    updated_at:new Date().toISOString()
  }).eq("id",usuarioActual.id);

  if(res.error){mostrarMsg("No se pudo guardar el PIN. Comprueba la conexión e inténtalo de nuevo.");return}

  borrarBloqueoLocal(usuarioActual);
  usuarioActual.pin_hash=hash;
  usuarioActual.debe_crear_pin=false;
  usuarioActual.pin_intentos=0;
  usuarioActual.pin_bloqueado_hasta=null;

  await registrarDispositivoSeguro();
  guardarSesion();
  if(ZENTRYX_SECURITY && typeof ZENTRYX_SECURITY.rememberSessionPin==="function"){
    await ZENTRYX_SECURITY.rememberSessionPin(p1);
  }
  mostrarMsg("PIN creado correctamente.","ok");
  setTimeout(irApp,500);
}

function pantallaPIN(){
  clearInterval(bloqueoTimer);

  app.innerHTML=`
    <h2>Acceso</h2>
    ${tarjetaUsuario(usuarioActual)}
    <label for="pin">Introduce PIN</label>
    <input id="pin" class="pin" inputmode="numeric" maxlength="4" placeholder="----" autocomplete="current-password">
    <button class="btn" id="btn_pin">Entrar</button>
    <button class="btn btn_sec" id="btn_volver">Cambiar usuario</button>
    <div id="msg" class="msg"></div>
  `;

  document.getElementById("btn_pin").onclick=entrar;
  document.getElementById("btn_volver").onclick=pantallaLogin;

  document.getElementById("pin").addEventListener("input",function(){this.value=this.value.replace(/\D/g,"").slice(0,4)});
  document.getElementById("pin").addEventListener("keydown",function(e){if(e.key==="Enter") entrar()});
  setTimeout(()=>{const pin=document.getElementById("pin");if(pin) pin.focus()},250);
}

async function entrar(){
  limpiarMsg();

  const sb=cliente();
  const pinInput=document.getElementById("pin");
  const pin=pinInput ? pinInput.value.trim() : "";

  if(!/^[0-9]{4}$/.test(pin)){
    mostrarMsg("Introduce los 4 números del PIN.");
    return;
  }

  const fresco=await refrescarUsuarioActual();

  if(!fresco){
    const bloqueoLocal=fechaBloqueoActiva(usuarioActual);
    if(bloqueoLocal){
      pantallaBloqueado(usuarioActual,bloqueoLocal);
      return;
    }

    mostrarMsg("No se pudo comprobar el usuario.");
    return;
  }

  if(usuarioActual.activo===false){
    pantallaLogin();
    mostrarMsg("Usuario desactivado.");
    return;
  }

  const bloqueo=fechaBloqueoActiva(usuarioActual);

  if(bloqueo){
    pantallaBloqueado(usuarioActual,bloqueo);
    return;
  }

  const verificacion=await ZENTRYX_SECURITY.verifyPin(pin,usuarioActual.pin_hash);

  if(verificacion.ok){
    borrarBloqueoLocal(usuarioActual);

    const nuevoHash=verificacion.needsUpgrade ? await ZENTRYX_SECURITY.hashPin(pin) : usuarioActual.pin_hash;

    const res=await sb.from("usuarios").update({
      pin_hash:nuevoHash,
      pin_intentos:0,
      pin_bloqueado_hasta:null,
      ultimo_login:new Date().toISOString(),
      updated_at:new Date().toISOString()
    }).eq("id",usuarioActual.id);

    if(res.error){
      mostrarMsg("No se pudo completar el acceso. Comprueba la conexión e inténtalo de nuevo.");
      return;
    }

    usuarioActual.pin_hash=nuevoHash;
    usuarioActual.pin_intentos=0;
    usuarioActual.pin_bloqueado_hasta=null;
    usuarioActual.ultimo_login=new Date().toISOString();

    await registrarDispositivoSeguro();
    guardarSesion();

    if(ZENTRYX_SECURITY && typeof ZENTRYX_SECURITY.rememberSessionPin==="function"){
      await ZENTRYX_SECURITY.rememberSessionPin(pin);
    }
    mostrarMsg("Acceso correcto.","ok");
    setTimeout(irApp,350);
    return;
  }

  const intentos=Number(usuarioActual.pin_intentos || 0)+1;
  let bloqueoNuevo=null;
  const ahora=new Date().toISOString();

  if(intentos>=3){
    const fecha=new Date();
    fecha.setMinutes(fecha.getMinutes()+5);
    bloqueoNuevo=fecha.toISOString();
    guardarBloqueoLocal(usuarioActual,bloqueoNuevo,ahora);
  }

  const res=await sb.from("usuarios").update({
    pin_intentos:intentos,
    pin_bloqueado_hasta:bloqueoNuevo,
    ultimo_pin_error:ahora,
    updated_at:ahora
  }).eq("id",usuarioActual.id);

  if(res.error){
    if(bloqueoNuevo){
      usuarioActual.pin_intentos=intentos;
      usuarioActual.pin_bloqueado_hasta=bloqueoNuevo;
      usuarioActual.ultimo_pin_error=ahora;
      pantallaBloqueado(usuarioActual,new Date(bloqueoNuevo));
      return;
    }

    mostrarMsg("Error registrando intento.");
    return;
  }

  usuarioActual.pin_intentos=intentos;
  usuarioActual.pin_bloqueado_hasta=bloqueoNuevo;
  usuarioActual.ultimo_pin_error=ahora;

  if(bloqueoNuevo){
    pantallaBloqueado(usuarioActual,new Date(bloqueoNuevo));
  }else{
    mostrarMsg("PIN incorrecto ("+intentos+"/3).");
    if(pinInput){pinInput.value="";pinInput.focus()}
  }
}

async function iniciar(){
  clearInterval(bloqueoTimer);

  if(typeof window.ZENTRYX_sessionValid==="function" && window.ZENTRYX_sessionValid()){
    location.replace("app.html?v="+ZX_APP_VERSION+"&t="+Date.now());
    return;
  }

  const ultimo=leerUltimoUsuario();

  if(ultimo && (ultimo.id || ultimo.usuario)){
    pantallaUltimoUsuario(ultimo);
    return;
  }

  pantallaLogin();
}

iniciar();
